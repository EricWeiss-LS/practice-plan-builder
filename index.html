<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Plan Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice Plan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Luceo tokens ─────────────────────────────────────── */
:root{
  --bg:#0B0D10;--bg-2:#14171C;--bg-3:#1A1D22;--bg-4:#1C2026;
  --ink:#ECECEC;--ink-dim:#9BA0A8;--ink-faint:#5A5F66;
  --accent:#E85D2C;--accent-hover:#F26D3C;--accent-soft:rgba(232,93,44,.08);
  --blue:#5E9EFF;--blue-soft:rgba(94,158,255,.10);
  --green:#34C56F;--red:#F04444;
  --border-color:#272C33;--border-hi-color:#353A42;--border-soft-color:#1C2026;
  --font-display:'Archivo Black','Arial Black',sans-serif;
  --font-sans:'Archivo',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius-sm:3px;--radius:4px;--radius-md:6px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s12:48px;
  --ease:cubic-bezier(.2,0,.1,1);--t-fast:.12s;--t-med:.25s;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* team brand, set from the editor */
  --team:#E85D2C;--team-ink:#ECECEC;
}
:root[data-theme="light"]{}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:overlay;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E")}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit}
::selection{background:var(--accent);color:#fff}

/* ── App shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%;min-height:100dvh}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border-color);background:rgba(11,13,16,.92);backdrop-filter:blur(20px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{height:22px;width:auto;display:block;color:var(--ink);flex:none}
.topbar .what{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-left:var(--s2)}
.topbar .spacer{flex:1}
.tabs{display:none;gap:0;border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden}
.tabs button{padding:8px 14px;font-size:12px;font-weight:600;color:var(--ink-dim)}
.tabs button.on{background:var(--bg-4);color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius);font-size:13px;font-weight:700;letter-spacing:-.01em;border:1px solid transparent;transition:all var(--t-fast) var(--ease);white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--blue)}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--border-color)}
.btn-secondary:hover{border-color:var(--border-hi-color);background:var(--bg-2);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--blue)}
.btn-ghost{color:var(--ink-dim);padding:6px 8px}
.btn-ghost:hover{color:var(--ink);background:var(--bg-4)}
.btn-danger{color:var(--red)}
.btn-danger:hover{background:rgba(240,68,68,.1)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;border-color:var(--blue)!important;box-shadow:0 0 0 3px var(--blue-soft)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:5px 7px}
.btn.icon svg{display:block}

.main{display:grid;grid-template-columns:420px 1fr;min-height:0}
.editor{overflow-y:auto;border-right:1px solid var(--border-color);background:var(--bg);padding:var(--s4) var(--s4) var(--s12)}
.stage{overflow:auto;background:var(--bg-3);padding:var(--s6)}
@media (max-width:1023px){
  .main{grid-template-columns:1fr}
  .tabs{display:inline-flex}
  .editor,.stage{display:none}
  .app[data-view="edit"] .editor{display:block;border-right:none}
  .app[data-view="preview"] .stage{display:block;padding:var(--s3)}
  .topbar .what{display:none}
}

/* ── Editor pieces ─────────────────────────────────────── */
.sec{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-2);margin-bottom:var(--s3)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:var(--s2);padding:12px 14px;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .name{font-weight:700;font-size:13px;letter-spacing:-.01em}
.sec>summary .meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin-left:auto}
.sec>summary .chev{color:var(--ink-faint);transition:transform var(--t-fast) var(--ease)}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec>summary:hover{background:var(--bg-3)}
.sec .body{padding:0 14px 14px;border-top:1px solid var(--border-soft-color);padding-top:12px}
.lbl{display:block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.f{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:var(--bg);border:1px solid var(--border-color);border-radius:var(--radius);color:var(--ink);font-size:14px;padding:9px 12px;outline:none;transition:border-color var(--t-fast)}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input.mono,textarea.mono{font-family:var(--font-mono);font-size:12px}
.hint{font-size:11px;color:var(--ink-faint);margin-top:4px}

.color-row{display:flex;align-items:center;gap:8px}
.color-row input[type=color]{width:40px;height:36px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg);padding:2px;cursor:pointer}
.color-row input[type=text]{flex:1}

.logo-drop{display:flex;align-items:center;gap:12px;border:1px dashed var(--border-hi-color);border-radius:var(--radius-md);padding:10px;background:var(--bg)}
.logo-drop .thumb{width:52px;height:52px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logo-drop .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.logo-drop .thumb .ph{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em}
.logo-drop label.btn{cursor:pointer}
.logo-drop input[type=file]{display:none}

/* editor tabs */
.etabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden;margin-bottom:var(--s4);position:sticky;top:0;z-index:5;background:var(--bg)}
.etabs button{padding:10px 8px;font-size:13px;font-weight:600;color:var(--ink-dim);border-right:1px solid var(--border-color)}
.etabs button:last-child{border-right:none}
.etabs button.on{background:var(--bg-4);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.etab-desc{font-size:12px;color:var(--ink-faint);padding:0 2px var(--s3);line-height:1.45;display:flex;align-items:flex-start;gap:8px}
.etab-desc span{flex:1}
.help-q{flex:none;width:20px;height:20px;border:1px solid var(--border-hi-color);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-dim);line-height:1;margin-top:-1px}
.help-q:hover{color:var(--ink);border-color:var(--ink-dim);background:var(--bg-3)}
.etab[hidden]{display:none}
/* block cards in the editor */
.blk{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg);margin-bottom:10px}
.blk .head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-soft-color);background:var(--bg-3);border-radius:var(--radius-md) var(--radius-md) 0 0}
.blk .head .idx{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);width:22px}
.blk .head .ttl{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .head .mins{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)}
.blk .inner{padding:10px}
.blk .lines{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lines-hd{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.lines{display:flex;flex-direction:column}
.ln{padding:10px 0;border-top:1px solid var(--border-soft-color)}
.ln-main{display:grid;grid-template-columns:1fr 24px;gap:6px;align-items:center}
.ln-name{display:flex;align-items:center;gap:8px;min-width:0;text-align:left;font-size:14px;color:var(--ink);background:none;border:none;padding:2px 0;cursor:pointer;font-family:inherit}
.ln-name:hover{color:var(--accent)}
.ln-name>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-name .dm{color:var(--team);font-size:9px}
.ln-addrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:10px 0 2px;border-top:1px solid var(--border-soft-color)}
.ln-addrow input{border-style:dashed;padding:6px 9px;font-size:13px}
.ln-meta .grp-btn{margin:0;height:100%}
.ln-imp{color:var(--ink-faint)}
.ln:hover .ln-imp,.ln-imp:focus-visible{color:var(--ink-dim)}
.ln .ln-desc{background:transparent;border:1px solid transparent;padding:6px 8px;margin-left:-8px;font-size:14px;color:var(--ink)}
.ln .ln-desc:hover{border-color:var(--border-color)}
.ln .ln-desc:focus{background:var(--bg-2);border-color:var(--blue)}
.ln-x{height:24px;color:var(--ink-faint);border-radius:var(--radius);opacity:0;transition:opacity var(--t-fast)}
.ln:hover .ln-x,.ln-x:focus-visible{opacity:1}
.ln-x:hover{color:var(--red);background:rgba(240,68,68,.1)}
.ln-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.ln-meta.two{grid-template-columns:1fr 1fr}
.ln-f{display:flex;align-items:center;min-width:0;border:1px solid var(--border-soft-color);border-radius:var(--radius);background:var(--bg-2)}
.ln-f:focus-within{border-color:var(--blue)}
.ln-f input,.ln-f select{border:none;background:transparent;padding:6px 8px;font-size:12px;min-width:0;flex:1;width:100%}
.ln-f input::placeholder{color:var(--ink-faint);font-family:var(--font-sans)}
.ln-f select.empty{color:var(--ink-faint)}
.ln-f select option{color:var(--ink)}
.ln-f input[aria-label="Player group"]{font-family:var(--font-mono);color:var(--team)}
.ln-f input:focus-visible,.ln-f select:focus-visible{box-shadow:none}
.ln-add{display:block;width:100%;text-align:left;padding:10px 0 2px;border-top:1px solid var(--border-soft-color);font-size:12px;font-weight:600;color:var(--ink-dim)}
.ln-add:hover{color:var(--ink)}
.addrow{display:flex;gap:6px;margin-top:8px}

/* call rails in the editor */
.rail-ed{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg);margin-bottom:10px;padding:10px}
.rail-ed .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rail-ed textarea{min-height:110px}

.courts-ctl{display:flex;gap:0;border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden;width:max-content}
.courts-ctl button{padding:7px 12px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);border-right:1px solid var(--border-color)}
.courts-ctl button:last-child{border-right:none}
.courts-ctl button.on{background:var(--bg-4);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--border-hi-color);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease);z-index:50}
.toast.show{opacity:1}

/* ── The sheet (digital, dark) ─────────────────────────── */
.paper-wrap{display:flex;justify-content:center}
.sheet{width:8.5in;min-height:11in;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:9.5pt;line-height:1.3;padding:.45in .5in .4in;border:1px solid var(--border-color);box-shadow:0 24px 64px rgba(0,0,0,.5);transform-origin:top center;display:flex;flex-direction:column}
@media (max-width:1023px){.sheet{transform:scale(var(--scale,1));margin-bottom:calc((var(--scale,1) - 1) * 11in)}}
.sh-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--team)}
.sh-logo{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.sh-logo img{max-width:100%;max-height:100%;object-fit:contain}
.sh-logo .mono-mark{width:54px;height:54px;background:var(--team);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;border-radius:3px}
.sh-team{font-family:var(--font-mono);font-size:8.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.sh-title{font-family:var(--font-display);font-size:22pt;line-height:1;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.sh-title .num{color:var(--team)}
.sh-sub{font-size:11pt;font-weight:600;color:var(--ink-dim);margin-top:4px;letter-spacing:-.01em}
.sh-date{text-align:right;font-family:var(--font-mono);font-size:9pt;color:var(--ink-dim)}
.sh-date .d{font-size:13pt;font-weight:700;color:var(--ink)}
.sh-date .t{font-size:8pt;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sh-focus{margin-top:8px;padding:7px 10px;background:var(--bg-2);border:1px solid var(--border-color);border-radius:var(--radius);font-size:10pt;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sh-focus b{font-family:var(--font-mono);font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--team);margin-right:8px}

.sh-grid{display:grid;grid-template-columns:1fr 1.9in;gap:16px;margin-top:12px;flex:1}
.sh-plan{min-width:0}
.sh-colhead{display:grid;grid-template-columns:.36in .36in 1fr 1.25in;gap:6px;font-family:var(--font-mono);font-size:7pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:4px;border-bottom:1px solid var(--border-color)}
.sh-block{display:grid;grid-template-columns:.36in .36in 1fr 1.25in;gap:6px;padding:7px 0 6px;border-bottom:1px solid var(--border-soft-color);break-inside:avoid}
.sh-block:last-child{border-bottom:none}
.sh-block .tt{font-family:var(--font-mono);font-size:11pt;font-weight:700;color:var(--team);line-height:1}
.sh-block .dt{font-family:var(--font-mono);font-size:11pt;font-weight:700;line-height:1;color:var(--ink)}
.sh-block .ob{font-family:var(--font-mono);font-size:7pt;color:var(--ink-dim);line-height:1.3;padding-top:2px;text-align:right}
.sh-block .bt{font-weight:700;font-size:10.5pt;letter-spacing:-.01em;line-height:1.15;color:var(--ink)}
.sh-block .bt .note{font-weight:400;font-size:8.5pt;color:var(--ink-dim);margin-left:8px}
.sh-block ul{list-style:none;margin-top:3px}
.sh-block li{font-size:9pt;padding:1px 0;color:var(--ink-dim);position:relative}
.sh-block li .obj{position:absolute;left:calc(100% + 6px);top:2px;width:1.25in;text-align:right;font-family:var(--font-mono);font-size:7pt;color:var(--ink-dim);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-block li .tag{font-family:var(--font-mono);font-size:6.5pt;font-weight:700;letter-spacing:.08em;color:var(--team);text-transform:uppercase;margin-left:8px;white-space:nowrap}
.sh-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:1px solid var(--border-hi-color);font-family:var(--font-mono);font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.sh-total b{font-size:12pt;color:var(--ink);letter-spacing:0}

.sh-rail{border-left:1px solid var(--border-color);padding-left:12px;min-width:0}
.rail{margin-bottom:12px;break-inside:avoid}
.rail .rt{font-family:var(--font-display);font-size:9.5pt;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);border-bottom:2px solid var(--team);padding-bottom:2px;margin-bottom:4px}
.rail .rc{columns:2;column-gap:10px}

.rail .rc .ch{font-family:var(--font-mono);font-size:6.5pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--border-color);margin-bottom:2px;padding-bottom:1px}
.rail .rc .ch:empty{display:none}
.rail .rc div{font-size:7.5pt;line-height:1.35;white-space:pre-line;word-break:break-word;color:var(--ink-dim)}
.sh-courts{display:grid;gap:10px;margin-top:12px;break-inside:avoid}
.sh-courts svg{width:100%;height:auto;display:block}
.sh-courts svg *{stroke:var(--ink-faint)!important}
.sh-reflect{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px;break-inside:avoid}
.ref{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-2);padding:8px 10px;min-height:.8in}
.ref .rl{font-family:var(--font-mono);font-size:7pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.ref .rv{font-size:9pt;white-space:pre-line;color:var(--ink)}
.ref .rv:empty{background:repeating-linear-gradient(to bottom,transparent 0,transparent 15px,var(--border-color) 15px,var(--border-color) 16px);min-height:.55in}
.sh-foot{margin-top:auto;padding-top:10px;border-top:2px solid var(--team)}
.sh-foot span{font-family:var(--font-display);font-size:11pt;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.sh-foot .by{font-family:var(--font-mono);font-size:6.5pt;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;align-self:center}


/* ── Library / tracker chrome ──────────────────────────── */
.lib{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border-color);background:var(--bg-2);flex-wrap:wrap}
.lib select{width:auto;min-width:200px;max-width:60vw}
.lib .status{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-left:auto}
.lib .status.live{color:var(--green)}
.team-sel{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-soft-color)}
.team-sel select{flex:1;min-width:0}
.start-here{border:1px solid var(--accent);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink);line-height:1.5}
.start-here .micro{color:var(--accent);display:block;margin-bottom:4px}
.me-btn.on{color:var(--green);border-color:transparent}
.mode{display:inline-flex;border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden}

/* ── Playbook editor & menu chips ──────────────────────── */

.cb{position:relative;min-width:0}.cb input{width:100%}
.cb-list{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:30;background:var(--bg-2);border:1px solid var(--border-hi-color);border-radius:var(--radius);max-height:240px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.cb-it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--ink-dim);cursor:pointer}
.cb-it.on,.cb-it:hover{background:var(--bg-3);color:var(--ink)}
.cb-it.new{color:var(--accent)}
.cb-it.dim{color:var(--ink-faint);cursor:default}
.cb-it>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.ln-main .cb{flex:1}
.ln-f .cb{flex:1}.ln-f .cb input{width:100%}
.libpane{display:none}
.app[data-pane="lib"] .paper-wrap,.app[data-pane="lib"] .live{display:none}
.app[data-pane="lib"] .libpane{display:block;max-width:1100px;margin:0 auto}
.lp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.lp-head h2{font-family:var(--font-display);font-size:20px;letter-spacing:-.02em;margin:0}
.lp-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--s4);align-items:start}
@media (max-width:1100px){.lp-grid{grid-template-columns:1fr}}
.lp-col{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-2);padding:14px}

.dr-g{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:12px 8px 4px;border-bottom:1px solid var(--border-soft-color);display:flex;justify-content:space-between}

.de-step{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-bottom:12px}
.de-n{width:22px;height:22px;border:1px solid var(--border-hi-color);border-radius:var(--radius);font-family:var(--font-mono);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);margin-top:1px}
.de-b .f{margin-bottom:0}.de-opt{font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--ink-faint);margin-left:4px}
.de-media{margin:8px 0 2px;border:1px solid var(--border-soft-color);border-radius:var(--radius)}
.de-m{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 10px;font-size:12px;border-bottom:1px solid var(--border-soft-color)}.de-m:last-child{border-bottom:none}
.dr-row .da{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity var(--t-fast)}
.dr-row:hover .da,.dr-row:focus-within .da{opacity:1}
.dr-row .da button{font-size:11px;padding:3px 7px}
.dr-empty{padding:12px 8px;font-size:12px;color:var(--ink-faint)}
.micro{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.tx-c{border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg);margin-top:10px}
.tx-c>summary{list-style:none;display:grid;grid-template-columns:14px 70px 1fr auto 28px;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
.tx-c>summary::-webkit-details-marker{display:none}

.tx-c>summary input:hover{border-color:var(--border-soft-color)}.tx-c>summary input:focus{border-color:var(--blue);background:var(--bg-2)}
.tx-c>.body{padding:0 10px 10px 10px;border-top:1px solid var(--border-soft-color)}
.tx-f{margin:10px 0 0 10px;padding-left:10px;border-left:2px solid var(--border-color)}
.tx-fh{display:grid;grid-template-columns:70px 1fr auto 28px;gap:8px;align-items:center;padding:4px 0}
.tx-fh input{font-size:13px;font-weight:700;color:var(--ink);background:none;border:1px solid transparent;padding:3px 6px;width:100%}
.tx-fh input:hover{border-color:var(--border-soft-color)}.tx-fh input:focus{border-color:var(--blue);background:var(--bg-2)}
.tx-s{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;padding:4px 0 6px}
.tx-s .chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tx-sub{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border:1px solid var(--border-soft-color);border-radius:var(--radius);font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-dim)}
.tx-sub button{color:var(--border-hi-color);font-size:11px;line-height:1;padding:0 3px}.tx-sub button:hover{color:var(--red)}
.tx-d{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;padding:2px 0 4px}
.tx-d .micro{padding-top:8px}
.tx-x{color:var(--border-hi-color);height:24px;border-radius:var(--radius);opacity:.35}.tx-x:hover{opacity:1;color:var(--red);background:rgba(240,68,68,.1)}
.tx-cnt{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap}
.add-lk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);background:none;border:none;padding:4px 6px;cursor:pointer;font-family:inherit;border-radius:var(--radius)}
.add-lk:hover{color:var(--ink);background:var(--bg-3)}
.add-fm{display:none;grid-template-columns:1fr auto;gap:4px;margin:4px 0}
.add-fm.on{display:grid}.add-fm input{padding:5px 9px;font-size:12px}
.dr-row{margin-left:0}
.dr-row .drn-b .ds{padding:1px 6px;border:1px solid var(--border-soft-color);border-radius:var(--radius);flex-shrink:0}
.tf-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mn-sec{margin-bottom:10px}
.mn-h{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-color);margin-bottom:2px}
.mn-row{display:grid;grid-template-columns:1fr 24px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--border-soft-color);font-size:13px}
.mn-row .x{color:var(--border-hi-color);border-radius:var(--radius);height:22px;opacity:0}
.mn-row:hover .x{opacity:1}.mn-row .x:hover{color:var(--red);background:rgba(240,68,68,.1)}
.mn-add{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-top:4px}.mn-add input{border-style:dashed;padding:6px 9px;font-size:13px}.mn-row .ln-name{font-size:13px;padding:0}
.tpl{border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg);max-height:260px;overflow:auto;margin:6px 0 8px}
.tpl-g{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px 2px}
.tpl-r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--border-soft-color)}
.tpl-r .n{font-size:13px;color:var(--ink)}
.tpl-r .m{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);margin-top:2px}
.tpl-r .a{display:flex;gap:4px}
.menu-sec{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--border-color);border-radius:var(--radius);font-size:12px;color:var(--ink-faint);cursor:pointer;background:var(--bg);user-select:none}
.chip.on{color:var(--ink);border-color:var(--border-hi-color);background:var(--bg-4)}
.chip input{appearance:none;width:8px;height:8px;border-radius:2px;background:var(--border-hi-color);margin:0}
.chip.on input{background:var(--team)}

/* ── Ratings ───────────────────────────────────────────── */
.rt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rt-pct{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:#A78BFA;border:1px solid #A78BFA;border-radius:var(--radius-sm);padding:2px 6px;background:rgba(167,139,250,.1)}
.rt-row{margin-bottom:12px}
.rt-lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.rt-i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1px solid var(--ink-faint);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);cursor:help}
.rt-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rt-pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden}
.rt-pair button{height:30px;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);background:var(--bg-2);transition:background var(--t-fast),color var(--t-fast)}
.rt-pair button+button{border-left:1px solid var(--border-color)}
.rt-pair button:hover{background:var(--bg-4);color:var(--ink)}
.rt-pair button.on{background:var(--accent);color:#fff}
.rt-bl{font-family:var(--font-mono);font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-player{border-top:1px solid var(--border-soft-color)}
.rt-player>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer;font-size:13px;font-weight:600}
.rt-player>summary::-webkit-details-marker{display:none}
.rt-player[open]>summary{color:var(--ink)}
.rt-player:not([open])>summary span:first-child{color:var(--ink-dim)}

/* ── PDF stage (offscreen render target) ────────────────── */
.pdfstage{position:fixed;left:-20000px;top:0;width:8.5in;background:var(--bg);color:var(--ink);z-index:-1}
.pdfstage .sheet{transform:none!important;margin:0!important;box-shadow:none;border:none;width:8.5in;min-height:11in}
.pdfstage .rp{width:8.5in;padding:.45in .5in;background:var(--bg)}
.pdfstage .rp .rp-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--team)}
.pdfstage .rp .rp-sec{padding-bottom:8px}
.pdfstage .rp .rp-title{font-family:var(--font-display);font-size:18pt;letter-spacing:-.02em;margin-bottom:12px}
.pdfstage .rp .recs{grid-template-columns:1fr 1fr}
.pdfstage .rp .chart svg{min-width:0}
.pdfstage .rp .how{display:none}
.pdfstage .call-line{cursor:default}
.pdfstage .rail .rc{columns:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}

/* ── Backup menu ───────────────────────────────────────── */
.exp.bk{margin-left:0}
.exp>div .bk-hd{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:6px 10px 4px}

.exp>div .as-btn{text-align:left;padding:8px 10px;font-size:12px;color:var(--ink-dim);border-radius:var(--radius);cursor:pointer;display:block}

.exp>div{min-width:220px}
.bk-status{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint);display:inline-flex;align-items:center;gap:6px}

.dlg-t{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em;margin-bottom:10px}

.bk-steps ol{margin:0 0 10px 18px}
.bk-steps li{margin-bottom:8px}
.bk-steps ul{margin:6px 0 0 16px;list-style:disc}
.bk-steps ul li{margin-bottom:4px;color:var(--ink-dim)}

.bk-steps .mono{font-family:var(--font-mono);font-size:11px;color:var(--ink)}
.bk-warn{border:1px solid rgba(232,177,74,.5);border-left:3px solid #E8B14A;background:rgba(232,177,74,.08);border-radius:var(--radius);padding:10px 12px;margin-top:4px;color:var(--ink);font-size:13px;line-height:1.5}
.bk-warn+.bk-warn{margin-top:8px}
.bk-warn-t{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#E8B14A;margin-bottom:4px}
.bk-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;margin-bottom:12px}
.bk-file{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;border-radius:var(--radius);font-size:12px;color:var(--ink);font-family:var(--font-mono)}
.bk-file:hover{background:var(--bg-4)}
.dlg-m{white-space:pre-line}

/* ── Manage mode ───────────────────────────────────────── */
.app[data-mode="manage"] .lib,.app[data-mode="manage"] .editor,.app[data-mode="manage"] .tabs{display:none!important}
.app[data-mode="manage"] .main{grid-template-columns:1fr}
.app[data-mode="manage"] .stage{display:block;padding:var(--s2) var(--s3) var(--s3);overflow:auto}

.live{position:sticky;top:0;z-index:5;background:rgba(26,29,34,.94);backdrop-filter:blur(12px);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:var(--s3)}

.lv-plan{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.lv-bar{flex:1;min-width:120px;height:4px;background:var(--bg-4);border-radius:2px;overflow:hidden}

.lv-blocks{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);white-space:nowrap}
.lv-btns{display:flex;gap:6px}
.lv-hint{font-size:11px;color:var(--ink-faint);margin-top:6px}

/* manage: drill checks + actual minutes */
.app[data-mode="manage"] .sh-block li{position:relative}
.app[data-mode="manage"] .chk{position:absolute;right:calc(100% + 14px);top:2px;width:13px;height:13px;border:1.5px solid var(--ink-faint);border-radius:3px;cursor:pointer;background:var(--bg)}
.app[data-mode="manage"] .chk.on{background:var(--team);border-color:var(--team)}

/* ── Court screen ──────────────────────────────────────── */
.court-ov{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.court-tools .btn.on{background:var(--bg-4);border-color:var(--border-hi-color);color:var(--ink)}
.pen-dot{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,.35)}
.exp.cm{margin-left:0}
.exp.cm>div{left:0;right:auto;min-width:190px}
.exp.cm>div button.sel{color:var(--ink);background:var(--bg-3)}

.draw-tray{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border-color);background:var(--bg-2)}
.draw-tray.hidden{display:none}
.court-sep{width:1px;height:22px;background:var(--border-color);margin:0 4px}
.swatch{width:28px;height:28px;border-radius:var(--radius);border:2px solid transparent;opacity:.6}
.swatch.on{border-color:var(--ink);opacity:1}
.court-stage{flex:1;min-height:0;display:flex;overflow:hidden;padding:0;background:var(--bg)}
.court-stage.bleed{align-items:flex-start;justify-content:center}
.court-stage.bleed .court-wrap{width:100%;height:auto;max-height:none;aspect-ratio:500/940}
.court-stage.fit{align-items:center;justify-content:center;padding:12px}
.court-stage.fit .court-wrap{height:100%;max-height:100%;aspect-ratio:500/940;width:auto;max-width:100%}
.court-wrap{position:relative;background:#fff}
.court-wrap.wood{background:#D8AE75}
.court-wrap .floor{position:absolute;inset:0}
.court-wrap .floor svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.court-wrap.wood>svg *{stroke:#fff!important;stroke-opacity:1}
.court-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.court-wrap>svg *{stroke:#111!important}
.court-wrap canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}

/* ── Playbook import ───────────────────────────────────── */
.imp-note{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1px solid var(--border-color);border-left:3px solid var(--accent);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
.imp-note b{color:var(--ink);font-size:13px}
.imp-note span{grid-column:1;font-size:12px;color:var(--ink-dim);line-height:1.45}
.imp-note .btn{grid-column:2;grid-row:1/3}

/* ── Linked references (Manage) ────────────────────────── */
.app[data-mode="manage"] .lk{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.app[data-mode="manage"] .lk:hover{text-decoration-thickness:2px}
.court-ref{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border-color);background:var(--bg-3);flex-wrap:wrap}
.court-ref .cr-src{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--team)}
.court-ref .cr-t{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em;flex:1}
.court-wrap .diagram{position:absolute;inset:0;pointer-events:none;transition:opacity var(--t-fast)}
.court-wrap .diagram svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.court-wrap .diagram.off{opacity:0}
.court-wrap.wood .diagram text{fill:#111}

/* section tally icon on the rail (Manage) */
.rail .rt{display:flex;align-items:center;justify-content:space-between}
.rt-ex{display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;color:var(--ink-dim);border-radius:3px;padding:0}
.rt-ex:hover{color:var(--ink);background:var(--bg-3)}
.rt-ex svg{display:block}

/* ── Key focus ─────────────────────────────────────────── */
.kf-dot{width:6px;height:6px;border-radius:2px;background:var(--accent);margin:0 8px 0 2px;flex:none}
.ln-main:has(.kf-dot){grid-template-columns:auto 1fr 24px}
.clips{display:flex;flex-direction:column;gap:4px}
.clip{display:grid;grid-template-columns:18px 1fr auto auto 24px;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--border-soft-color);border-radius:var(--radius);background:var(--bg)}
.clip .clip-ic{font-size:11px;color:var(--team);text-align:center}
.clip .clip-where{margin:0;white-space:nowrap}
.dlg.vid{max-width:900px;width:100%}
.dlg.vid video{width:100%;max-height:70vh;background:#000;border-radius:var(--radius)}
.sh-kf{margin-top:14px;padding:10px 12px;border:1px solid var(--border-color);border-left:3px solid var(--team);border-radius:var(--radius);background:var(--bg-2)}
.sh-kf .kf-h{font-family:var(--font-mono);font-size:7pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--team);margin-bottom:3px}
.sh-kf .kf-t{font-size:11pt;color:var(--ink);font-weight:600}
.sh-kf ul{margin:3px 0 0 14px;padding:0;list-style:disc}
.sh-kf li{font-size:9.5pt;color:var(--ink-dim);padding:2px 0}
.sh-kf .kf-clips{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px}
.sh-kf .kf-clip{font-family:var(--font-mono);font-size:7.5pt;color:var(--ink)}

/* ── Coaches / roles / groups ──────────────────────────── */
.coach-list{display:flex;flex-direction:column;gap:4px}
.coach-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border-color);border-radius:var(--radius);font-size:14px;color:var(--ink);text-align:left}
.coach-row:hover{border-color:var(--border-hi-color);background:var(--bg-3)}
.coach-row.sel{border-color:var(--accent)}
.coach-row .role{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.coach-row .role.head{color:var(--accent)}
.ro-note{border:1px solid var(--border-color);border-left:3px solid #E8B14A;border-radius:var(--radius);background:rgba(232,177,74,.06);padding:8px 12px;font-size:12px;color:var(--ink-dim);margin-bottom:var(--s3)}
.lk-btn{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-size:inherit;padding:0}
.app[data-role="assistant"] .etab[data-tab="library"] .sec,.app[data-role="assistant"] .etab[data-tab="plan"] .sec{pointer-events:none;opacity:.55}
.app[data-role="assistant"] .etab[data-tab="library"] .sec>summary,.app[data-role="assistant"] .etab[data-tab="plan"] .sec>summary{pointer-events:auto}
.app[data-role="assistant"] .lib .only-build{display:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.gchip{padding:4px 10px;border:1px solid var(--border-color);border-radius:var(--radius);font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)}
.gchip.on{background:var(--team);border-color:var(--team);color:#fff}
.call .cn-sub{display:block;font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.04em;margin-top:1px}
.app[data-mode="manage"] .chk.other{background:var(--bg-4);border-color:var(--ink-faint)}
.app[data-mode="manage"] .chk.other::after{border-color:var(--ink-dim)}
.staff-note{border:1px solid var(--border-soft-color);border-radius:var(--radius);padding:10px 12px;margin-top:10px;background:var(--bg)}
.staff-note .sn-k{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.staff-note .sn-v{font-size:13px;color:var(--ink-dim);white-space:pre-line}
.grp-rows{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.grp-row{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
.grp-row b{color:var(--ink-dim);font-weight:600}

/* role explainer in the coach picker */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (max-width:520px){.role-grid{grid-template-columns:1fr}}
.role-col{border:1px solid var(--border-color);border-radius:var(--radius);padding:10px 12px;background:var(--bg)}
.role-col .rc-h{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.role-col .rc-h.head{color:var(--accent)}
.role-col ul{margin:0 0 0 14px;padding:0;list-style:disc}
.role-col li{font-size:12px;color:var(--ink-dim);line-height:1.45;margin-bottom:2px}

/* ── Headshots ─────────────────────────────────────────── */
.headshot{width:36px;height:36px;border-radius:var(--radius);background:var(--bg-3);border:1px solid var(--border-color);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none}
.headshot img{width:100%;height:100%;object-fit:cover;display:block}
.headshot span{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-dim);letter-spacing:.04em}
.headshot:hover{border-color:var(--border-hi-color)}
.headshot.sm{width:24px;height:24px;cursor:default;margin-right:8px;vertical-align:middle}
.headshot.sm span{font-size:8px}
.rt-name{display:inline-flex;align-items:center}
.roster-row .pn{margin-left:4px}

/* ── Player group picker ───────────────────────────────── */
.grp-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;padding:6px 8px;border:1px dashed var(--border-color);border-radius:var(--radius);text-align:left;font-size:12px;color:var(--ink-dim)}
.grp-btn:hover{border-color:var(--border-hi-color);color:var(--ink)}
.grp-btn.on{border-style:solid;color:var(--ink)}
.grp-btn .grp-ph{color:var(--ink-faint)}
.grp-avs{display:inline-flex}
.grp-avs .headshot.xs{width:20px;height:20px;margin:0 0 0 -6px;border:1px solid var(--bg-2)}
.grp-avs .headshot.xs:first-child{margin-left:0}
.headshot.xs{width:20px;height:20px;cursor:default}
.headshot.xs span{font-size:7px}
.gp-list{display:flex;flex-direction:column;gap:3px;max-height:55vh;overflow:auto}
.gp-row{display:grid;grid-template-columns:auto 1fr auto 18px;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--border-soft-color);border-radius:var(--radius);text-align:left;color:var(--ink-dim)}
.gp-row:hover{border-color:var(--border-hi-color)}
.gp-row.on{color:var(--ink);border-color:var(--team);background:rgba(255,255,255,.02)}
.gp-row .headshot.sm{margin:0}
.gp-name{font-size:13px}
.gp-ini{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.06em}
.gp-chk{width:14px;height:14px;border:1.5px solid var(--ink-faint);border-radius:3px;position:relative}
.gp-row.on .gp-chk{background:var(--team);border-color:var(--team)}
.gp-row.on .gp-chk::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.gb-btn{cursor:pointer;border:none;padding:0}
.gb-btn:hover{outline:2px solid var(--ink-faint);outline-offset:1px}

/* ── Scroll caps for long tracker lists ────────────────── */
.card .tw{max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.card .tw thead th{position:sticky;top:0;background:var(--bg-2);z-index:1;box-shadow:inset 0 -1px 0 var(--border-color)}
.card .mix-list{max-height:300px;overflow-y:auto;overscroll-behavior:contain}
.card .ut-list{max-height:280px;overflow-y:auto;overscroll-behavior:contain}
.card .pills.cap{max-height:200px;overflow-y:auto;overscroll-behavior:contain}
.dlg .tw{max-height:300px;overflow-y:auto}
.dlg .tw thead th{position:sticky;top:0;background:var(--bg-2);z-index:1}

/* pill row */
.pillrow{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.pillbtn{padding:5px 12px;border:1px solid var(--border-color);border-radius:var(--radius);font-size:12px;font-weight:600;color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px}
.pillbtn:hover{border-color:var(--border-hi-color);color:var(--ink)}
.pillbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pillbtn i{font-style:normal;font-family:var(--font-mono);font-size:10px;opacity:.7}

/* collapsible tracker containers */
.tcard{padding:0;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-2);margin-bottom:var(--s3)}
.tcard>summary{list-style:none;display:flex;align-items:flex-start;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.tcard>summary::-webkit-details-marker{display:none}
.tcard>summary .chev{color:var(--ink-faint);transition:transform var(--t-fast) var(--ease);margin-top:2px}
.tcard[open]>summary .chev{transform:rotate(90deg)}
.tcard>summary:hover{background:var(--bg-3)}
.tcard .tc-t{flex:1;min-width:0}
.tcard .tc-title{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.tcard .tc-sub{font-size:12px;color:var(--ink-faint);line-height:1.45;margin-top:3px}
.tcard>summary .ct-r{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
.tcard .tc-body{padding:0 16px 16px;border-top:1px solid var(--border-soft-color);padding-top:12px}
.tcard.rec .tc-body{padding:0 16px 14px;padding-top:10px}
.tcard.rec .rc-h{display:none}
.recs .tcard{margin-bottom:0;align-self:start}
.recs .tcard>summary{min-height:84px;align-items:flex-start}
.recs .tcard .tc-sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.45em * 2)}
.tcard.card.last{border-color:var(--border-hi-color)}

/* ── Pucks ─────────────────────────────────────────────── */
.pucks{position:absolute;inset:0;pointer-events:none}
.puck{position:absolute;width:9%;max-width:64px;min-width:34px;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;cursor:grab;border:2px solid var(--team);border-radius:var(--radius);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.puck img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.puck span{font-family:var(--font-display);font-size:clamp(10px,2.2vw,16px);color:#111;letter-spacing:.02em;pointer-events:none}
.puck.drag{cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:2}
.court-wrap.wood .puck{border-color:var(--team)}
.exp.cm>div button[data-puck]{display:flex;align-items:center;gap:8px}
.exp.cm>div button[data-puck] .headshot.xs{margin:0}

/* block timer in the live bar */
.lv-blk{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg)}
.lv-blk .lv-bnum{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
.lv-blk .lv-bname{font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-blk .lv-bbar{flex:0 0 120px;height:4px;background:var(--bg-4);border-radius:2px;overflow:hidden}
.lv-blk .lv-bbar i{display:block;height:100%;background:var(--team);width:0}
.lv-blk .lv-bclock{font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.lv-blk .lv-bplan{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
.lv-blk.warn{border-color:#E8B14A;background:rgba(232,177,74,.08)}
.lv-blk.warn .lv-bclock{color:#E8B14A}.lv-blk.warn .lv-bbar i{background:#E8B14A}
.lv-blk.over{border-color:var(--red);background:rgba(240,68,68,.1)}
.lv-blk.over .lv-bclock{color:var(--red)}.lv-blk.over .lv-bbar i{background:var(--red)}
.lv-blk.done .lv-bname{color:var(--ink-dim)}
.lv-snd{width:28px;height:28px;border:1px solid var(--border-color);border-radius:var(--radius);color:var(--ink-faint);font-size:14px}
.lv-snd.on{color:var(--ink);border-color:var(--border-hi-color)}
.app[data-mode="manage"] .sh-block.current{box-shadow:inset 3px 0 0 var(--team);background:rgba(255,255,255,.02)}
@media (max-width:700px){.lv-blk .lv-bbar{display:none}}

/* diagram thumbnails in Results */
.diag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.diag-thumb{display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg);text-align:left}
.diag-thumb:hover{border-color:var(--border-hi-color)}
.diag-thumb .thumb{width:100%;height:auto;display:block;border-radius:2px}
.diag-thumb .dt-l{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);letter-spacing:.04em}

/* header + sub-header cleanup */
.topbar .team-pick{justify-self:center;width:auto;min-width:220px;max-width:50vw;font-family:var(--font-display);font-size:15px;letter-spacing:-.01em;padding:7px 36px 7px 12px;text-align:center}
.lib{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.lib .bk-status{justify-self:start}
.lib .mode{justify-self:center}
.lib .exp.kebab{justify-self:end;margin-left:0}
.lib{row-gap:8px}
.lib .bk-status{margin-left:2px}
.exp.kebab{margin-left:auto}
.exp.kebab>summary{padding:6px 10px;font-size:16px;line-height:1;font-weight:700}
.exp.kebab>div{right:0;left:auto;min-width:220px}
.kb-h{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:10px 10px 3px;border-top:1px solid var(--border-soft-color);margin-top:4px}
.kb-h:first-child{border-top:none;margin-top:0;padding-top:4px}
.kb-note{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);padding:4px 10px 6px}
.kb-note.live{color:var(--green)}
.exp.kebab>div #demoBtn{color:var(--ink-dim)}.exp.kebab>div #demoBtn.danger{color:var(--red)}
.exp>div button.danger{color:var(--red)}
.exp>div .bk-hd.live{color:var(--green)}
@media (max-width:1023px){.lib .tabs{margin-left:auto}.lib .tabs+.exp.kebab{margin-left:8px}}

/* ── Tutorial ──────────────────────────────────────────── */
.tut-dlg{max-width:560px}
.tut-k{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tut-b{font-size:14px;color:var(--ink-dim);line-height:1.55;min-height:200px}
.tut-b p{margin-bottom:10px}
.tut-b ul{margin:0 0 10px 18px}
.tut-b li{margin-bottom:6px}
.tut-b b{color:var(--ink)}
.tut-dots{display:flex;gap:6px;margin:6px 0 14px}
.tut-dots i{width:18px;height:3px;background:var(--border-hi-color);cursor:pointer}
.tut-dots i.on{background:var(--accent)}

/* ── Seasons ───────────────────────────────────────────── */
.exp.season{margin-left:0}
.exp.season>summary{font-weight:700;color:var(--ink)}
.exp.season>div{left:0;right:auto;min-width:220px}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);margin-top:8px}
.chk-row input{width:14px;height:14px;accent-color:var(--accent)}
.app[data-archived="1"] .etab[data-tab="plan"] .sec,.app[data-archived="1"] .etab[data-tab="reflect"] .sec{pointer-events:none;opacity:.55}
.app[data-archived="1"] .etab .sec>summary{pointer-events:auto}
.app[data-archived="1"] .lib .only-build{display:none}
.app[data-archived="1"] .lv-btns .btn-primary,.app[data-archived="1"] .chk,.app[data-archived="1"] .rt-ex{pointer-events:none;opacity:.5}

/* season row in Library */
.season-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--bg-2);padding:12px 14px;margin-bottom:var(--s3)}
.season-row .sr-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.season-row .sr-name{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em}
.season-row .sr-arch{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#E8B14A;margin-left:8px;vertical-align:middle}
.season-row .sr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.season-row .sr-sel{width:auto;padding:6px 10px;font-size:12px}
.app[data-role="assistant"] .season-row,.app[data-archived="1"] .season-row{pointer-events:auto;opacity:1}

/* drill notes */
.app[data-mode="manage"] .sh-block li .obj{width:calc(1.25in - 18px)}
.dn{position:absolute;left:calc(100% + 6px + 1.25in - 12px);top:1px;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-faint);border:1px solid transparent;border-radius:2px;padding:0}
.dn:hover{color:var(--ink);border-color:var(--border-hi-color)}
.dn.has{color:var(--team);border-color:var(--team)}
.dn svg{display:block}
.dn-list{display:flex;flex-direction:column;gap:4px}
.dn-row{display:grid;grid-template-columns:minmax(90px,1fr) 2fr;gap:10px;padding:6px 8px;border:1px solid var(--border-soft-color);border-radius:var(--radius);background:var(--bg)}
.dn-row .dn-l{font-size:12px;color:var(--ink);font-weight:600}
.dn-row .dn-t{font-size:12px;color:var(--ink-dim);white-space:pre-line}

/* ── Dialog ────────────────────────────────────────────── */
.dlg-ov{position:fixed;inset:0;background:rgba(11,13,16,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}

@page{size:letter portrait;margin:0}
@media print{
  :root{padding:0}
  body{background:var(--bg)}
  body::before{display:none}
  .topbar,.editor,.toast{display:none!important}
  .app{display:block;height:auto;min-height:0}

  .app[data-print="report"] .tk-head{display:none}
  .rp-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--team)}
  .rp-sec{break-before:page}

  .how{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ── Data model ─────────────────────────────────────────
   settings: {team, taxonomy}            shared doc settings/main
   practices: {id, meta, blocks, rails, reflect}  docs practices/<id>
   Taxonomy: [{name, focuses:[{name, subs:[...]}]}]
   Block: {min,obj,title,note,cat,focus,lines:[{tag,text,sub}]}
──────────────────────────────────────────────────────── */
const KEY='luceo.practice-plan.v2';const TKEY='luceo.practice-plan.teams';
let TEAMS={active:'main',list:[{id:'main',name:''}]};
function teamsLoad(){try{const t=JSON.parse(localStorage.getItem(TKEY)||'null');if(t&&Array.isArray(t.list)&&t.list.length&&t.list.some(x=>x.id===t.active))TEAMS=t;}catch(e){}}
function teamsSave(){try{localStorage.setItem(TKEY,JSON.stringify(TEAMS));}catch(e){}if(DB&&CAN_WRITE)DB.doc('settings/teams').set(JSON.parse(JSON.stringify(TEAMS))).catch(()=>{});}
const TEAM=()=>TEAMS.active;const keyFor=id=>id==='main'?KEY:KEY+'.'+id;const sdoc=id=>'settings/'+(id==='main'?'main':'t-'+id);const ckeyFor=id=>id==='main'?'luceo.coach':'luceo.coach.'+id;
function teamEntry(){let t=TEAMS.list.find(x=>x.id===TEAM());if(!t){t={id:TEAM(),name:''};TEAMS.list.push(t);}return t;}
function teamNameSync(){const t=teamEntry();const n=(ST.team&&ST.team.name||'').trim();if(t.name!==n){t.name=n;teamsSave();}}
const teamLabel=t=>t.name||(t.id==='main'?'My team':'Untitled team');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseInt(v,10);return isNaN(n)?0:n;};

const seedTax=()=>([
  {name:'Defense',focuses:[
    {name:'PNR Protections',subs:['Slide','Slash','Angle','Empty','Multitask']},
    {name:'Closeouts',subs:['Nearest Foot','Sprint to Stance']},
    {name:'Disadvantage',subs:['Win the Reaction','5 Home Spacing']},
    {name:'Transition D',subs:['Build the Wall','Sprint Back']}]},

    {name:'Transition O',subs:['Rim Run','Drag Screen']}]},
  {name:'Film',focuses:[{name:'Curriculum',subs:['PNR Protections','Task Cohesion','Opponent']}]},
  {name:'Warmup',focuses:[{name:'Team Warmup',subs:['Multitask Intro','Warmup Game']}]},
  {name:'Special',focuses:[{name:'Dead Ball',subs:['SOB Execution','BOB Execution']}]}
]);
/* Diagram stand-ins for Luceo-linked plays and drills. Coordinates are half-court (500x470), basket at top. */
function diag(players,moves){const P=players.map(p=>p.t==='x'?`<g><line x1="${p.x-9}" y1="${p.y-9}" x2="${p.x+9}" y2="${p.y+9}"/><line x1="${p.x+9}" y1="${p.y-9}" x2="${p.x-9}" y2="${p.y+9}"/></g>`:
  `<g><circle cx="${p.x}" cy="${p.y}" r="12" fill="${p.ball?'#E85D2C':'#fff'}" stroke="#111"/><text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="13" font-weight="700" font-family="Archivo,sans-serif" fill="#111">${p.n||''}</text></g>`).join('');
  const M=moves.map(m=>{const [x1,y1]=m.f,[x2,y2]=m.t;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;const ex=x2-ux*14,ey=y2-uy*14;
    if(m.k==='screen'){const px=-uy*12,py=ux*12;return `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}"/><line x1="${ex+px}" y1="${ey+py}" x2="${ex-px}" y2="${ey-py}" stroke-width="4"/>`;}
    if(m.k==='dribble'){const n=Math.max(2,Math.round(L/14));let d=`M${x1} ${y1}`;for(let i=1;i<=n;i++){const t=i/n;const sx=x1+dx*t,sy=y1+dy*t;const off=(i%2?1:-1)*6;d+=` Q${x1+dx*(t-.5/n)-uy*off} ${y1+dy*(t-.5/n)+ux*off} ${sx} ${sy}`;}return `<path d="${d}" fill="none"/><polygon points="${x2},${y2} ${ex-uy*6},${ey+ux*6} ${ex+uy*6},${ey-ux*6}" fill="#111"/>`;}
    const dash=m.k==='pass'?' stroke-dasharray="8 6"':'';return `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}"${dash}/><polygon points="${x2},${y2} ${ex-uy*6},${ey+ux*6} ${ex+uy*6},${ey-ux*6}" fill="#111"/>`;}).join('');
  return `<svg viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg"><g stroke="#111" stroke-width="3" stroke-linecap="round" fill="none">${M}</g>${P}</svg>`;}
const DIAGRAMS={
  'Snap':diag([{x:250,y:330,n:1,ball:1},{x:120,y:250,n:2},{x:380,y:250,n:3},{x:170,y:120,n:4},{x:290,y:200,n:5}],[{f:[290,200],t:[262,300],k:'screen'},{f:[250,330],t:[330,230],k:'dribble'},{f:[290,200],t:[240,110],k:'cut'}]),
  'Horns Chest':diag([{x:250,y:340,n:1,ball:1},{x:70,y:230,n:2},{x:430,y:230,n:3},{x:190,y:190,n:4},{x:310,y:190,n:5}],[{f:[190,190],t:[232,318],k:'screen'},{f:[250,340],t:[150,250],k:'dribble'},{f:[310,190],t:[260,100],k:'cut'},{f:[150,250],t:[250,110],k:'pass'}]),
  'Fist':diag([{x:250,y:350,n:1,ball:1},{x:90,y:260,n:2},{x:410,y:260,n:3},{x:170,y:120,n:4},{x:250,y:210,n:5}],[{f:[250,210],t:[256,330],k:'screen'},{f:[250,350],t:[150,270],k:'dribble'},{f:[250,210],t:[230,100],k:'cut'},{f:[90,260],t:[80,120],k:'cut'}]),
  'Box':diag([{x:250,y:20,n:1,ball:1},{x:200,y:120,n:2},{x:300,y:120,n:3},{x:200,y:230,n:4},{x:300,y:230,n:5}],[{f:[300,120],t:[218,116],k:'screen'},{f:[200,120],t:[110,120],k:'cut'},{f:[250,20],t:[115,120],k:'pass'},{f:[300,230],t:[380,180],k:'cut'}]),
  'Pick & Roll 1-on-2':diag([{x:250,y:330,n:1,ball:1},{x:300,y:200,n:5},{x:262,y:300,t:'x'},{x:300,y:170,t:'x'}],[{f:[300,200],t:[268,296],k:'screen'},{f:[250,330],t:[340,240],k:'dribble'},{f:[300,200],t:[250,120],k:'cut'}]),
  'Build the wall 3-on-2':diag([{x:250,y:450,n:1,ball:1},{x:120,y:400,n:2},{x:380,y:400,n:3},{x:230,y:280,t:'x'},{x:270,y:230,t:'x'}],[{f:[250,450],t:[250,300],k:'dribble'},{f:[120,400],t:[100,200],k:'cut'},{f:[380,400],t:[400,200],k:'cut'},{f:[230,280],t:[200,330],k:'cut'}]),
  '3 Side Puzzle':diag([{x:250,y:330,n:1,ball:1},{x:420,y:260,n:2},{x:380,y:120,n:3},{x:90,y:240,n:4},{x:300,y:190,n:5}],[{f:[250,330],t:[400,265],k:'pass'},{f:[250,330],t:[330,330],k:'cut'},{f:[300,190],t:[372,240],k:'screen'},{f:[380,120],t:[300,70],k:'cut'}])
};
const seedPlaybook=()=>{const sec=(name,plays)=>({id:uid(),name,groups:[{id:uid(),name:'',plays:plays.map(n=>({id:uid(),name:n,...(DIAGRAMS[n]?{luceo:{id:'demo-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')}}:{})}))}]});
  return [
    sec('Jungle',['Fist','Fist Flare','Loop','Zipper']),
    sec('Turbo',['Hook','Ear','Side / Angle','Snap','Nose','Up Snap','UP Fist','Octagon','Octagon 5','Chest','Wide','Backside','Tap Side','Tap Small','Tap Double','Tap Flash','Tap Scrum','Double (Go)','Double Small','Swing Fist','Horns Chest']),
    sec('SOB',['Box','Line','Stack']),sec('BOB',['Elevator','Hammer','Triangle'])];};
const allPlayIds=pb=>pb.flatMap(s=>s.groups.flatMap(g=>g.plays.map(p=>p.id)));
const DEMO_ROSTER=['Amari Williams','Caleb Grill','Chris Cenac Jr.','Dillon Mitchell','Hank Morgan','Hayden Gray','Milos Uzan','Tucker DeVries'];
const freshSettings=()=>({team:{name:'',logo:'',accent:'#E85D2C',ink:'#ECECEC'},coaches:[],roster:[],taxonomy:[],drills:[],playbook:[],menu:[],templates:[],seasons:[],drillsBuilt:true,demoLoaded:true,cleanup1:true,demoCoaches:true,demoStaff:2,demoRoster:2,demoNames:2,pbStructured:true,demoPurged:true});
const seedSettings=()=>{const pb=seedPlaybook();return {team:{name:'Maine Celtics',logo:'',accent:'#007A33',ink:'#ECECEC'},taxonomy:seedTax(),playbook:pb,menu:allPlayIds(pb),roster:DEMO_ROSTER.map(n=>({id:uid(),name:n}))};};
const blankPractice=(n,date,title='')=>({id:uid(),teamId:TEAM(),meta:{label:'Practice',number:String(n),title,date:date||today(),time:'',focus:''},
  blocks:[],menu:[],results:{},keyFocus:{text:'',bullets:[],clips:[]}});
function today(){const d=new Date();return d.toISOString().slice(0,10);}

/* Five-practice demo season. Built after settings exist so plays and players resolve by name. */
function demoPractices(){
  const pid=n=>{const p=playsAll().find(x=>x.name===n);return p?p.id:null;};
  const rid=n=>{const p=ST.roster.find(x=>x.name===n);return p?p.id:null;};
  const B=(min,title,cat,focus,lines,obj='',note='')=>({min,obj:'',title,note,cat,focus,lines:lines.map(([text,sub,tag],i)=>{const k=Object.keys(DIAGRAMS).find(d=>text.startsWith(d));return {text,sub:sub||'',tag:tag||'',obj:i===0?obj:'',...(k?{luceo:{id:'demo-'+k.toLowerCase().replace(/[^a-z0-9]+/g,'-'),key:k}}:{})};})});
  const calls=(o,g)=>{const c={};Object.entries(o).forEach(([n,[reps,grade]])=>{const id=pid(n);if(id)c[id]={g:{[g||'']:{reps,grade:grade||''}}};});return c;};
  const R=(session,players)=>{const out={session,players:{},rated:[]};Object.entries(players).forEach(([n,sc])=>{const id=rid(n);if(!id)return;out.rated.push(id);out.players[id]=sc;});return out;};
  const sc=(prep,compete,comm,focus,exec)=>({prep,compete,comm,focus,exec});
  const P=(number,title,date,theme,blocks,c,r,reflect)=>({id:uid(),demo:true,meta:{label:'Practice',number:String(number),title,date,time:'10:00 AM',focus:theme+' · Awareness · Connection · Toughness'},blocks,menu:null,results:{__head:{calls:calls(c),drills:{},ratings:r,reflect:{notes:reflect.notes||'',saw:reflect.saw||'',carry:reflect.carry||''}}},keyFocus:{text:reflect.keyFocus||'',bullets:reflect.bullets||[],clips:[]}});
  return [
    P(1,'PNR coverage install, task cohesion, film','2026-09-30','15/15?',[
      B(10,'Team Warmup','Warmup','Team Warmup',[['PNR Protections Multitask Intro','Multitask Intro'],['Warmup Game','Warmup Game']]),
      B(15,'Defensive Micro Possessions','Defense','PNR Protections',[['Closeouts (NF)','','AW, CG, DM'],['Pick & Roll 1-on-2 (AJ)','Slide','CC, HM, HG'],['3-Man Actions (DM)','Angle','AW, CC'],['Protections 3-on-4 (GS)','Multitask','CG, DM, HM']],'',"E10's, DM, CC on offense"),
      B(10,'Task Cohesion','Offense','Task Cohesion',[['3 Side Puzzle, both sides','3 Side Puzzle'],['Cutting read vs. switch','Cutting Read']]),
      B(15,'Celtics Curriculum (FILM)','Film','Curriculum',[['PNR Protections: Slide, Slash, Angle, Empty','PNR Protections'],['Offensive Task Cohesion: 3 Side Puzzle','Task Cohesion']],'12 reps x 2'),
      B(25,'Mindset Games','Offense','Mindset Games',[['2x pts for C&S 3 or layup','C&S 3'],['+2 for paint touch','Paint Touch'],['+1 for cycle','Cycle'],['+2 for offensive rebound','Offensive Rebound']],'','0:16 shot clock, points not on scoreboard')],
      {'Snap':[4,'D'],'Horns Chest':[2,'A'],'Double (Go)':[2,'C'],'Hook':[2,'B'],'Fist':[3,'B'],'Box':[2,'C'],'Hammer':[1,'A'],'Tap Side':[1,'']},
      R(sc(5,6,4,5,4),{'Amari Williams':sc(6,7,5,4,7),'Caleb Grill':sc(5,6,5,6,6),'Chris Cenac Jr.':sc(6,4,6,6,6),'Dillon Mitchell':sc(7,7,6,7,7)}),
      {notes:'First full install day. Protections took longer than planned.',keyFocus:'Install the language for pick and roll coverage. Every player should be able to name Slide, Slash, Angle and Empty on sight before we ask them to execute any of it at speed. Reps are slow and loud today.',bullets:['Name the coverage out loud before the screen arrives','Ball handler hears the call from both the screener\'s defender and the low man','Nearest foot leads every closeout','No live reps until the call is right three times in a row'],saw:'Snap tag was late every rep. Red team won the reaction game twice.',carry:'Re-rep Snap before anything new. Shorten film.'}),
    P(2,'PNR coverage, 2-court disadvantage, film','2026-10-01','Talk early',[
      B(10,'Team Warmup','Warmup','Team Warmup',[['Multitask warmup','Multitask Intro'],['Warmup Game','Warmup Game']]),
      B(20,'Defensive Micro Possessions','Defense','PNR Protections',[['Closeouts (NF)','Nearest Foot','AW, CG, DM'],['Pick & Roll 1-on-2','Slide','CC, HM, HG'],['Slash coverage 2-on-2','Slash','AW, CC'],['Empty-side protection','Empty','CG, DM, HM']]),
      B(10,'2 Courts Continuous','Defense','Disadvantage',[['Defense to Win the Reaction vs. red','Win the Reaction'],['Defense to 5 Home Spacing','5 Home Spacing']]),
      B(10,'Celtics Curriculum (FILM)','Film','Curriculum',[['PNR Protections review','PNR Protections']],'8 clips'),
      B(25,'Mindset Games','Offense','Mindset Games',[['2x pts for C&S 3','C&S 3'],['+2 paint touch','Paint Touch'],['+1 cycle','Cycle']],'','0:16 shot clock')],
      {'Snap':[5,'C'],'Horns Chest':[2,'A'],'Double (Go)':[2,'C'],'Hook':[1,'B'],'Ear':[2,'B'],'Fist':[2,'B'],'Loop':[1,''],'Box':[1,'C'],'Hammer':[2,'A'],'Chest':[2,'C']},
      R(sc(6,7,5,7,5),{'Amari Williams':sc(6,7,5,4,7),'Caleb Grill':sc(6,7,5,6,7),'Chris Cenac Jr.':sc(6,4,6,7,6),'Hank Morgan':sc(6,6,6,6,6)}),
      {notes:'',keyFocus:'Communication on the ball screen, called early enough to be useful. Yesterday the call came as the screen hit. Today the standard is the call before the screener leaves his man, with the low man echoing it.',bullets:['Call the coverage when the screener starts to move, not when he arrives','Low man repeats the call so the ball defender hears it twice','Win the Reaction: first to the loose ball or the red team gets the possession','Compete game has a consequence this time: losers run'],saw:'Communication improved once Grill called it. Cenac coasted in the reaction game.',carry:'Compete game needs a consequence. Add Mitchell to the slide group.'}),
    P(3,'Transition D, actions, dead ball','2026-10-03','Finish the possession',[
      B(10,'Team Warmup','Warmup','Team Warmup',[['Warmup Game','Warmup Game']]),
      B(20,'Defensive Micro Possessions','Defense','PNR Protections',[['Pick & Roll 1-on-2','Slide','CC, HM, DM'],['Slash coverage','Slash','AW, CC'],['Empty-side','Empty','CG, HG'],['Multitask 4-on-4','Multitask']]),
      B(15,'Transition Defense','Defense','Transition D',[['Build the wall 3-on-2','Build the Wall'],['Sprint back vs. outlet','Sprint Back']]),
      B(10,'Actions','Offense','Actions',[['Horns High reads','Horns High'],['Snap entries live','Snap']]),
      B(15,'Mindset Games','Offense','Mindset Games',[['2x pts C&S 3','C&S 3'],['+2 offensive rebound','Offensive Rebound']],'','0:16 shot clock, loser runs'),
      B(10,'Dead Ball','Special','Dead Ball',[['SOB live reps','SOB Execution']])],
      {'Snap':[6,'C'],'Horns Chest':[3,'A'],'Double (Go)':[3,'D'],'Nose':[2,'B'],'Fist':[2,'A'],'Fist Flare':[2,'B'],'Box':[3,'C'],'Line':[2,'B'],'Hammer':[2,'A'],'Chest':[1,'B'],'Wide':[2,'B'],'Backside':[1,'']},

function tally(id,d,g){if(!S)return;if(!seasonEditable()){toast('Archived season: read only.');return;}const k=gkey(g===undefined?TG:g);const B=my();const c=B.calls[id]||(B.calls[id]={g:{}});const e=c.g[k]||(c.g[k]={reps:0,grade:''});e.reps=Math.max(0,e.reps+d);if(!e.reps&&!e.grade)delete c.g[k];if(!Object.keys(c.g).length)delete B.calls[id];up('practice',true);}
function setGrade(id,gr,g){if(!S)return;if(!seasonEditable()){toast('Archived season: read only.');return;}const k=gkey(g===undefined?TG:g);const B=my();const c=B.calls[id]||(B.calls[id]={g:{}});const e=c.g[k]||(c.g[k]={reps:0,grade:''});e.grade=gr;if(!e.reps&&!e.grade)delete c.g[k];if(!Object.keys(c.g).length)delete B.calls[id];up('practice',true);}
function practiceGroups(p){const out=new Set();(p.blocks||[]).forEach(b=>(b.lines||[]).forEach(l=>{const t=gkey(l.tag);if(t)out.add(t);}));return [...out];}
/* aggregation across coaches */
function aggCalls(p){const out={};buckets(p).forEach(([cid,b])=>Object.entries(b.calls||{}).forEach(([id,c])=>{const a=out[id]||(out[id]={reps:0,grades:[],byGroup:{},byCoach:{}});callGroups(c).forEach(([k,e])=>{a.reps+=e.reps||0;if(e.grade)a.grades.push(e.grade);const bg=a.byGroup[k]||(a.byGroup[k]={reps:0,grades:[]});bg.reps+=e.reps||0;if(e.grade)bg.grades.push(e.grade);});const bc=a.byCoach[cid]||(a.byCoach[cid]={reps:0,grades:[]});bc.reps+=callTotal(c);bc.grades.push(...callGrades(c));}));return out;}
function aggDrills(p){const out={};buckets(p).forEach(([cid,b])=>Object.keys(b.drills||{}).forEach(k=>{(out[k]||(out[k]=[])).push(cid);}));return out;}
function aggSession(p){const vals={};buckets(p).forEach(([cid,b])=>{CRIT.forEach(([k])=>{const v=b.ratings&&b.ratings.session&&b.ratings.session[k];if(v){(vals[k]||(vals[k]=[])).push(v);}});});const o={};Object.entries(vals).forEach(([k,a])=>o[k]=a.reduce((x,y)=>x+y,0)/a.length);return o;}
function aggPlayers(p){const out={};buckets(p).forEach(([cid,b])=>Object.entries((b.ratings||{}).players||{}).forEach(([pid,o])=>{const a=out[pid]||(out[pid]={});CRIT.forEach(([k])=>{if(o[k]){(a[k]||(a[k]=[])).push(o[k]);}});}));const r={};Object.entries(out).forEach(([pid,a])=>{r[pid]={};Object.entries(a).forEach(([k,arr])=>r[pid][k]=arr.reduce((x,y)=>x+y,0)/arr.length);});return r;}
function initialsOf(name){const parts=(name||'').trim().split(/\s+/).filter(x=>x&&!/^(jr|sr|ii|iii|iv)\.?$/i.test(x));return parts.length?(parts[0][0]+(parts[parts.length-1][0]||'')).toUpperCase():'';}

function taxEd(c,i){
  return `<div class="tax-cat">
    <div class="row"><input type="text" value="${esc(c.name)}" placeholder="Focus" oninput="ST.taxonomy[${i}].name=this.value;up('settings')" style="font-weight:700">
      <button class="btn btn-ghost btn-sm btn-danger" onclick="ST.taxonomy.splice(${i},1);up('settings',true)" title="Delete category">✕</button></div>
    ${c.focuses.map((f,j)=>`<div class="foc">
      <input type="text" value="${esc(f.name)}" placeholder="Sub-focus" oninput="ST.taxonomy[${i}].focuses[${j}].name=this.value;up('settings')">
      <input type="text" class="mono" value="${esc(f.subs.join(', '))}" placeholder="Sub-focuses, comma separated" oninput="ST.taxonomy[${i}].focuses[${j}].subs=this.value.split(',').map(s=>s.trim()).filter(Boolean);up('settings')">
      <button class="x" style="color:var(--ink-faint)" onclick="ST.taxonomy[${i}].focuses.splice(${j},1);up('settings',true)" title="Remove focus">✕</button></div>`).join('')}
    <div class="addrow"><button class="btn btn-ghost btn-sm" onclick="ST.taxonomy[${i}].focuses.push({name:'',subs:[]});up('settings',true)">+ Focus</button></div></div>`;
}
function blockEd(b,i){
  const n=S.blocks.length;
  return `<div class="blk">
    <div class="head"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="ttl">${esc(b.title)||'Untitled block'}</span><span class="mins">${num(b.min)} min</span>
      <button class="btn btn-ghost btn-sm" ${i===0?'disabled':''} onclick="mv(${i},-1)" title="Move up">↑</button>
      <button class="btn btn-ghost btn-sm" ${i===n-1?'disabled':''} onclick="mv(${i},1)" title="Move down">↓</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="S.blocks.splice(${i},1);up('practice',true)" title="Delete block">✕</button></div>
    <div class="inner">
      <div class="row" style="margin-bottom:8px">
        <div style="width:72px"><label class="lbl">Min</label><input type="number" min="0" value="${num(b.min)}" oninput="S.blocks[${i}].min=this.value;up()"></div>
      </div>
      <div class="f" style="margin-bottom:8px"><label class="lbl">Title</label><input type="text" value="${esc(b.title)}" oninput="S.blocks[${i}].title=this.value;up()"></div>
      <div class="g2" style="margin-bottom:8px">
        <div><label class="lbl">Category</label><div class="cb"><input type="text" data-cb="cat|${i}" value="${esc(b.cat)}" placeholder="Defense, Offense, Film…"></div></div>
        <div><label class="lbl">Focus</label><div class="cb"><input type="text" data-cb="focus|${i}" value="${esc(b.focus)}" placeholder="${b.cat?'PNR coverage, Closeouts…':'Category first'}" ${b.cat?'':'disabled'}></div></div>
      </div>
      <div class="f" style="margin-bottom:0"><label class="lbl">Side note</label><input type="text" value="${esc(b.note)}" placeholder="Who's on offense, constraints, shot clock" oninput="S.blocks[${i}].note=this.value;up()"></div>
      <div class="lines-hd"><span class="lbl" style="margin:0">Drills</span><span class="hint" style="margin:0">${b.lines.length}</span></div>
      <div class="lines">${b.lines.map((l,j)=>`<div class="ln">
        <div class="ln-main"><button class="ln-name" onclick="drillEditFromLine(${i},${j})" title="Open this drill">${esc(l.text)||'<span class="hint" style="margin:0">Untitled drill</span>'}${drillHasMedia(l)?'<span class="dm">◉</span>':''}</button><button class="ln-x" onclick="S.blocks[${i}].lines.splice(${j},1);up('practice',true)" title="Remove drill">✕</button></div>
        <div class="ln-meta two">
          <label class="ln-f"><input type="text" value="${esc(l.obj||'')}" placeholder="Objective" aria-label="Objective" oninput="S.blocks[${i}].lines[${j}].obj=this.value;drillSync(${i},${j});up()" onblur="persist('settings')"></label>
          <button class="grp-btn ${(l.players||[]).length?'on':''}" onclick="openGroupPicker(${i},${j})">${(l.players||[]).length?`<span class="grp-avs">${(l.players||[]).slice(0,6).map(id=>headshotHtml(id,'xs')).join('')}</span><span>${esc(groupLabel(l))}</span>`:'<span class="grp-ph">Player group · whole team</span>'}</button>
        </div></div>`).join('')}</div>
      <div class="ln-addrow"><div class="cb"><input type="text" data-cb="drillpick|${i}" placeholder="${drills().length?'Add a drill from your library':'Search or create a drill'}"></div><button class="btn btn-secondary btn-sm" onclick="drillNewForBlock(${i})">New drill</button></div>
    </div></div>`;
}
function groupChipsHtml(){const gs=practiceGroups(S);return `<div class="gchips"><span class="lbl" style="margin:0 6px 0 0">Tallying for</span><button class="gchip ${TG===''?'on':''}" onclick="TG='';up('practice',true)">Whole team</button>${gs.map(g=>`<button class="gchip ${TG===g?'on':''}" onclick="TG=${JSON.stringify(g).replace(/"/g,'&quot;')};up('practice',true)">${esc(g)}</button>`).join('')}</div>`;}
function callRowHtml(p){const c=my().calls[p.id];const e=c&&c.g&&c.g[gkey(TG)]||{reps:0,grade:''};const tot=callTotal(c);const others=callGroups(c).filter(([k])=>k!==gkey(TG)&&c.g[k].reps);
  return `<div class="call ${tot?'on':''}"><span class="cn">${esc(p.name)}${others.length?`<span class="cn-sub">${others.map(([k,x])=>`${k||'team'} ×${x.reps}${x.grade?' '+x.grade:''}`).join(' · ')}</span>`:''}</span>
    <button class="tb" onclick="tally('${p.id}',-1)" ${e.reps?'':'disabled'}>−</button><span class="cr">${e.reps}</span><button class="tb" onclick="tally('${p.id}',1)">+</button>
    <div class="gr">${GL.map(g=>`<button class="${e.grade===g?'on':''} ${g?'g'+g:''}" onclick="setGrade('${p.id}','${g}')">${g||'·'}</button>`).join('')}</div></div>`;}
function callsBodyHtml(){return `
      <div class="hint" style="margin-bottom:8px">Tap a call on the sheet to add a rep, or use the counters here. Reps and grades are recorded under ${esc(coachName(coachId()))} for the group selected below.</div>
      ${groupChipsHtml()}
      ${railsView().length?railsView().map(sec=>`<div class="lbl" style="margin:10px 0 4px">${esc(sec.name)||'Untitled'}</div><div class="calls">${sec.plays.map(callRowHtml).join('')}</div>`).join(''):'<div class="hint">Nothing on the play menu for this practice.</div>'}
`;}
function menuListHtml(){const m=new Set(menu());
  const secs=ST.playbook.map((sec,si)=>{const plays=sec.groups.flatMap(g=>g.plays);const on=plays.filter(p=>m.has(p.id));
    return `<div class="mn-sec"><div class="mn-h"><span class="lbl" style="margin:0">${esc(sec.name)||'Untitled section'}</span><span class="hint" style="margin:0">${on.length?on.length+' on rail':''}</span></div>
      ${on.map(p=>`<div class="mn-row"><button class="mn-n ln-name" onclick="playEditOpen('${p.id}')" title="Open this play">${esc(p.name)}${playHasMedia(p)?'<span class="dm">◉</span>':''}</button><button class="x" onclick="menuToggle('${p.id}',false)" title="Take off the rail">✕</button></div>`).join('')}
      <div class="mn-add"><div class="cb"><input type="text" data-cb="play|${si}" placeholder="${plays.length>on.length?'Add a play from '+esc(sec.name||'this section'):'Search or create a play'}"></div><button class="btn btn-secondary btn-sm" onclick="playNewForSection(${si})">New play</button></div></div>`;}).join('');
  return `<div class="pb-add" style="margin-bottom:12px"><input type="text" placeholder="New section (Jungle, Turbo, SOB, BOB)" onkeydown="if(event.key==='Enter'&&this.value.trim()){pbAddSection(this.value);}"><button class="btn btn-ghost btn-sm" onclick="if(this.previousElementSibling.value.trim())pbAddSection(this.previousElementSibling.value)">Add section</button></div>`+
    (secs||`<div class="hint">No play sections yet. Sections are the rail headings: group plays the way you call them (Jungle for half-court sets, Turbo for early offense, SOB, BOB, ATO, Zone).</div>`);}
function renderMenuList(){const el=document.getElementById('menuList');if(el){el.innerHTML=menuListHtml();cbInit(el);}}
function menuAdd(si,r){let p=r.create?null:r.p;if(!p){p=playsAll().find(x=>x.name.toLowerCase()===r.label.trim().toLowerCase());}if(!p){playNewForSection(si,r.label);return;}const m=menu();if(!m.includes(p.id))m.push(p.id);up('practice',true);refreshCalls();}
function playNewForSection(si,name){playEditOpen(null,{si,name:name||'',onSave:p=>{const m=menu();if(!m.includes(p.id))m.push(p.id);up('practice',true);refreshCalls();}});}
function playCreateOpen(name){const ov=document.createElement('div');ov.className='dlg-ov';const secs=ST.playbook.filter(x=>x.name);
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" style="max-width:460px"><div class="dlg-t">New play</div>
