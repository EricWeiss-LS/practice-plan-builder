/* ── Tracker ───────────────────────────────────────────── */
const TF={preset:'last10',from:'',to:''};let MQ='';let ET='plan';let TT='next';let RN='carry';
const STALE_N=3;
function windows(){const all=sorted();let cur,prev;
  if(TF.preset==='all'){cur=all;prev=[];}
  else if(TF.preset==='custom'){cur=all.filter(p=>{const d=p.meta.date||'';return !(TF.from&&d<TF.from)&&!(TF.to&&d>TF.to);});const first=cur.length?all.indexOf(cur[0]):0;prev=first>0?all.slice(Math.max(0,first-cur.length),first):[];}
  else{const n=+TF.preset.slice(4);cur=all.slice(-n);prev=all.slice(Math.max(0,all.length-2*n),all.length-n);}
  return {cur,prev,all};}
const label=p=>`${p.meta.label} #${p.meta.number}`;const titleOf=p=>(p.meta.title||'').trim()||label(p);
function rowsFor(list){const out=[];for(const p of list){const d=p.meta.date||'';
  p.blocks.forEach((b,bi)=>{const mins=actualMin(p,bi);const tagged=b.lines.filter(l=>l.sub);
    out.push({pid:p.id,practice:label(p),date:d,block:b.title,line:'',cat:b.cat||'Untagged',focus:b.focus||'',sub:'',minutes:mins,occ:1,level:'block'});
    tagged.forEach(l=>out.push({pid:p.id,practice:label(p),date:d,block:b.title,line:l.text,cat:b.cat||'Untagged',focus:b.focus||'',sub:l.sub,minutes:+(mins/tagged.length).toFixed(1),occ:1,level:'line'}));});}
  return out;}
function callRowsFor(list){const out=[];for(const p of list){const d=p.meta.date||'';
  buckets(p).forEach(([cid,b])=>Object.entries(b.calls||{}).forEach(([id,c])=>{callGroups(c).forEach(([g,e])=>{if(e.reps||e.grade){const pl=playsAll().find(x=>x.id===id);out.push({pid:p.id,practice:label(p),num:p.meta.number,date:d,id,call:pl?pl.name:'(deleted play)',section:pl?pl.section:'',reps:e.reps||0,grade:e.grade||'',group:g,coach:cid});}});}));}
  return out;}
function ratingRowsFor(list){const out=[];for(const p of list){const d=p.meta.date||'';
  buckets(p).forEach(([cid,b])=>{const R=b.ratings||{};const push=(subj,id,o)=>CRIT.forEach(([k,l])=>{if(o&&o[k])out.push({pid:p.id,practice:label(p),num:p.meta.number,date:d,subject:subj,sid:id,crit:k,critLabel:l,score:o[k],coach:cid});});
  push('Session','session',R.session);Object.entries(R.players||{}).forEach(([id,o])=>push(playerName(id),id,o));});}
  return out;}
const rows=()=>rowsFor(windows().cur),callRows=()=>callRowsFor(windows().cur),ratingRows=()=>ratingRowsFor(windows().cur);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v===null||v===undefined?'':Number.isInteger(v)?String(v):v.toFixed(1);
const gLetter=n=>n===null?'':n>=3.5?'A':n>=2.5?'B':n>=1.5?'C':'D';
const gb=g=>g?`<span class="gb g${g}">${g}</span>`:'';
const delta=(d,unit='',inv=false)=>{if(d===null||d===undefined||Math.abs(d)<0.05)return '<span class="dl flat">—</span>';const up=d>0;const good=inv?!up:up;return `<span class="dl ${good?'up':'down'}">${up?'▲':'▼'}${Math.abs(d)%1?Math.abs(d).toFixed(1):Math.abs(d)}${unit}</span>`;};
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* aggregate helpers */
function catMix(list){const R=rowsFor(list).filter(r=>r.level==='block');const tot=R.reduce((a,r)=>a+r.minutes,0);const m={};R.forEach(r=>{m[r.cat]=(m[r.cat]||0)+r.minutes;});return {tot,m,share:Object.fromEntries(Object.entries(m).map(([k,v])=>[k,pct(v,tot)]))};}
function lastWorked(key,fn){const all=sorted();for(let i=all.length-1;i>=0;i--){if(fn(all[i]))return {p:all[i],ago:all.length-1-i};}return null;}
function subStatus(){const {cur,all}=windows();const out=[];ST.taxonomy.forEach(c=>c.focuses.forEach(f=>f.subs.forEach(s=>{
  const hit=p=>p.blocks.some(b=>b.cat===c.name&&b.focus===f.name&&b.lines.some(l=>l.sub===s));
  const inCur=cur.filter(hit).length;const lw=lastWorked(null,hit);out.push({cat:c.name,focus:f.name,sub:s,inCur,last:lw,stale:!lw||lw.ago>=STALE_N});})));return out;}
function playStats(list){const R=callRowsFor(list);const agg={};R.forEach(r=>{const a=agg[r.id]||(agg[r.id]={id:r.id,name:r.call,section:r.section,pr:new Set(),occ:0,reps:0,g:[],gl:[],last:'',byGroup:{}});if(r.reps)a.pr.add(r.pid);a.occ=a.pr.size;a.reps+=r.reps;if(r.grade){a.g.push(GR[r.grade]);a.gl.push(r.grade);}if(r.date>a.last)a.last=r.date;const bg=a.byGroup[r.group]||(a.byGroup[r.group]={reps:0,g:[]});bg.reps+=r.reps;if(r.grade)bg.g.push(GR[r.grade]);});
  return Object.values(agg).map(a=>({...a,avgN:avg(a.g),avgL:gLetter(avg(a.g)),lastG:a.gl[a.gl.length-1]||'',prevG:a.gl[a.gl.length-2]||''}));}
function playerStats(list){const R=ratingRowsFor(list).filter(r=>r.sid!=='session');const ids=[...new Set(R.map(r=>r.sid))];
  return ids.map(id=>{const rs=R.filter(r=>r.sid===id);const pids=[...new Set(rs.map(r=>r.pid))];const crit=CRIT.map(([k,l])=>({k,l,v:avg(rs.filter(r=>r.crit===k).map(r=>r.score))})).filter(c=>c.v!==null);
    const weakest=crit.slice().sort((a,b)=>a.v-b.v)[0];const byP=pids.map(pid=>avg(rs.filter(r=>r.pid===pid).map(r=>r.score)));const overall=avg(rs.map(r=>r.score));
    const trend=byP.length>1?(byP[byP.length-1]-byP[0]):null;return {id,name:rs[0].subject,n:pids.length,crit,weakest,overall,overallPct:Math.round(overall*10),trend};});}
function sessionStats(list){const R=ratingRowsFor(list).filter(r=>r.sid==='session');const pids=[...new Set(R.map(r=>r.pid))];
  const per=pids.map(pid=>{const rs=R.filter(r=>r.pid===pid);return {pid,num:rs[0].num,pct:Math.round(avg(rs.map(r=>r.score))*10)};});
  const crit=CRIT.map(([k,l])=>{const rs=R.filter(r=>r.crit===k);const sc=rs.map(r=>r.score);return {k,l,avg:avg(sc),latest:sc[sc.length-1]??null,trend:sc.length>1?sc[sc.length-1]-sc[0]:null};});
  return {per,crit,latest:per[per.length-1]||null,avgPct:per.length?Math.round(avg(per.map(p=>p.pct))):null};}

/* ── render ── */
function renderTracker(){const T=document.getElementById('tracker');const {cur,prev,all}=windows();

      <span class="tk-win">${esc(viewSeason()?viewSeason().name+' · ':'')}${cur.length?`${cur.length} practice${cur.length>1?'s':''} · ${esc(cur[0].meta.date||'')}${cur.length>1?' to '+esc(cur[cur.length-1].meta.date||''):''}`:'No practices in range'}</span>

function tkSub(title){const t=title.toLowerCase();for(const k in TK_SUB){if(t.startsWith(k))return TK_SUB[k];}return '';}
function collapsify(root){let first=true;let gridOpen=0;root.querySelectorAll('.card:not(.chart-inline), .rec').forEach((el,i)=>{if(el.classList.contains('tcard'))return;const inGrid=!!el.closest('.recs');
  const head=el.querySelector(':scope > .ct, :scope > .rc-h');if(!head)return;const extra=head.querySelector('.ct-r');const title=(head.childNodes[0]&&head.childNodes[0].textContent||head.textContent).trim();
  const key=TT+'|'+title.toLowerCase().replace(/\s+\d+$/,'');let dflt=first;if(inGrid){dflt=gridOpen<2;gridOpen++;}const open=key in TK_STATE?TK_STATE[key]:dflt;first=false;

  head.remove();const body=document.createElement('div');body.className='tc-body';while(el.firstChild)body.appendChild(el.firstChild);
  d.appendChild(sum);d.appendChild(body);d.addEventListener('toggle',()=>{TK_STATE[key]=d.open;});el.replaceWith(d);});}
function trackTime(cur,prev){const C=catMix(cur),P=catMix(prev);const R=rowsFor(cur);const subs=subStatus();const touched=subs.filter(s=>s.inCur).length;
  const cats=Object.entries(C.m).sort((a,b)=>b[1]-a[1]);const cols=Object.fromEntries(cats.map(([k],i)=>[k,PAL[i%PAL.length]]));
  const mix=cats.map(([k,v])=>`<div class="mix"><span class="mx-c" style="background:${cols[k]}"></span><span class="mx-n">${esc(k)}</span><span class="mx-bar"><i style="width:${C.share[k]}%;background:${cols[k]}"></i></span><span class="mx-v">${C.share[k]}%</span><span class="mx-m">${f1(v)} min</span>${prev.length?delta(C.share[k]-(P.share[k]||0),' pts'):''}</div>`).join('');
  // focus table

  const pAgg={};rowsFor(prev).filter(r=>r.level==='block'&&r.focus).forEach(r=>{const k=r.cat+'|'+r.focus;pAgg[k]=(pAgg[k]||0)+r.minutes;});
  const frows=Object.entries(fAgg).sort((a,b)=>b[1].min-a[1].min).map(([k,a])=>{const lw=lastWorked(null,p=>p.blocks.some(b=>b.cat===a.cat&&b.focus===a.focus));
    return `<tr><td><span class="dot" style="background:${cols[a.cat]||'#666'}"></span>${esc(a.focus)}<span class="sub">${esc(a.cat)}</span></td><td class="n">${f1(a.min)}</td><td class="n">${pct(a.min,C.tot)}%</td><td class="n">${a.pr.size}</td><td class="n">${lw?(lw.ago?lw.ago+' ago':'last'):''}</td><td class="n">${prev.length?delta(a.min-(pAgg[k]||0),'m'):''}</td></tr>`;}).join('');
  const untouched=subs.filter(s=>!s.inCur);const byCat={};untouched.forEach(s=>{(byCat[s.cat]||(byCat[s.cat]=[])).push(s);});

      <div class="kpi"><div class="k">Per practice</div><div class="v">${Math.round(C.tot/cur.length)}</div><div class="s">${prev.length?delta(Math.round(C.tot/cur.length)-Math.round(P.tot/prev.length),'m'):'minutes'}</div></div>

    </div>
    <div class="card"><div class="ct">Where the minutes went${prev.length?`<span class="ct-r">change vs previous ${prev.length}</span>`:''}</div><div class="mix-list">${mix||'<div class="hint">No tagged blocks.</div>'}</div></div>

function trackResults(cur,prev){const SS=sessionStats(cur),PS=sessionStats(prev);const plays=playStats(cur);const players=playerStats(cur).sort((a,b)=>b.overall-a.overall);
  const spark=(()=>{if(SS.per.length<2)return '';const W=240,H=44,n=SS.per.length;const x=i=>6+i*((W-12)/(n-1)),y=v=>H-4-(H-8)*v/100;return `<svg class="spark" viewBox="0 0 ${W} ${H}"><polyline points="${SS.per.map((p,i)=>`${x(i)},${y(p.pct)}`).join(' ')}" fill="none" stroke="${ST.team.accent||'#E85D2C'}" stroke-width="2"/>${SS.per.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.pct)}" r="2.5" fill="${ST.team.accent||'#E85D2C'}"><title>#${esc(p.num)} · ${p.pct}%</title></circle>`).join('')}</svg>`;})();
  const critRows=SS.crit.filter(c=>c.avg!==null).sort((a,b)=>a.avg-b.avg).map(c=>`<tr><td>${c.l}</td><td class="n">${Math.round(c.avg*10)}%</td><td class="n">${Math.round(c.latest*10)}%</td><td class="n">${delta(c.trend===null?null:Math.round(c.trend*10),' pts')}</td><td class="n"><span class="band">${BANDS[Math.min(4,Math.max(0,Math.ceil(c.avg/2)-1))]}</span></td></tr>`).join('');
  const sessionCard=`<div class="card"><div class="ct">Session rating</div>${SS.per.length?`<div class="sess"><div><div class="big">${SS.latest.pct}%</div><div class="s">latest · avg ${SS.avgPct}% over ${SS.per.length}${prev.length&&PS.avgPct!==null?' · '+delta(SS.avgPct-PS.avgPct,' pts')+' vs previous':''}</div></div>${spark}</div>
    <div class="tw"><table><thead><tr><th>Criterion · lowest first</th><th class="n">Avg</th><th class="n">Latest</th><th class="n">Trend</th><th class="n">Band</th></tr></thead><tbody>${critRows}</tbody></table></div>`:'<div class="hint">No session ratings in this window. Rate the session in Results.</div>'}</div>`;
  const graded=plays.filter(p=>p.avgN!==null);const well=graded.filter(p=>p.avgN>=2.5&&p.reps>=2),clean=graded.filter(p=>p.avgN<2.5&&p.reps>=2),light=plays.filter(p=>p.reps===1||(p.avgN===null&&p.reps>0));
  const never=playsAll().filter(p=>!sorted().some(x=>aggCalls(x)[p.id]&&aggCalls(x)[p.id].reps));
  const prow=p=>{return `<tr><td>${esc(p.name)}<span class="sub">${esc(p.section)}</span></td><td class="n">${p.occ}</td><td class="n">${p.reps}</td><td class="n">${gb(p.avgL)}</td><td class="n">${gb(p.lastG)}${p.prevG&&p.lastG?(GR[p.lastG]>GR[p.prevG]?' <span class="dl up">▲</span>':GR[p.lastG]<GR[p.prevG]?' <span class="dl down">▼</span>':''):''}</td></tr>`;};
  const ptable=(title,arr,note)=>`<div class="card"><div class="ct">${title}<span class="ct-r">${arr.length}</span></div>${arr.length?`<div class="tw"><table><thead><tr><th>Play</th><th class="n">Practices</th><th class="n">Reps</th><th class="n">Avg</th><th class="n">Last</th></tr></thead><tbody>${arr.map(prow).join('')}</tbody></table></div>`:`<div class="hint">${note}</div>`}</div>`;
  const playsH=`${ptable('Needs cleanup · avg C or worse',clean.sort((a,b)=>a.avgN-b.avgN),'No play is grading out below B.')}${ptable('Executing well · avg B or better',well.sort((a,b)=>b.avgN-a.avgN),'Nothing graded B or better yet.')}${ptable('Light reps · run once',light,'Everything run got more than one rep.')}
    <div class="card"><div class="ct">On the menu, never run<span class="ct-r">${never.length}</span></div>${never.length?`<div class="pills cap">${never.map(p=>`<span class="pill never">${esc(p.name)}<i>${esc(p.section)}</i></span>`).join('')}</div>`:'<div class="hint">Every play in the playbook has been run.</div>'}</div>`;
  const pb=id=>playerPlaybook(cur,id);
  const plRows=players.map(p=>{const b=pb(p.id);return `<tr><td><span class="rt-name">${headshotHtml(p.id)}${esc(p.name)}</span></td><td class="n">${p.n}</td><td class="n">${b.reps||''}</td><td class="n">${b.grade?`<button class="gb g${b.grade} gb-btn" onclick="openPlayerDetail('${p.id}')" title="Open ${esc(p.name)}">${b.grade}</button>`:''}</td><td class="n"><b>${p.overallPct}%</b></td><td>${p.weakest?`<span class="weak">${p.weakest.l} ${Math.round(p.weakest.v*10)}%</span>`:''}</td><td class="n">${delta(p.trend===null?null:Math.round(p.trend*10),' pts')}</td></tr>`;}).join('');
  const playersH=`<div class="card"><div class="ct">Players<span class="ct-r">${players.length} rated</span></div>${players.length?`<div class="tw"><table><thead><tr><th>Player</th><th class="n">Practices</th><th class="n">Group reps</th><th class="n">Playbook</th><th class="n">Overall</th><th>Weakest</th><th class="n">Trend</th></tr></thead><tbody>${plRows}</tbody></table></div>`:'<div class="hint">No player ratings in this window.</div>'}</div>`;
  return sessionCard+playsH+playersH+(isHead()?staffCard(cur):'');}
function playerPlaybook(list,id){const R=callRowsFor(list).filter(r=>r.group&&groupHas(r.group,id));const by={};R.forEach(r=>{const a=by[r.id]||(by[r.id]={id:r.id,name:r.call,section:r.section,reps:0,g:[],gl:[],pr:new Set(),last:''});a.reps+=r.reps;if(r.grade){a.g.push(GR[r.grade]);a.gl.push(r.grade);}if(r.reps)a.pr.add(r.pid);if(r.date>a.last)a.last=r.date;});
  const plays=Object.values(by).map(a=>({...a,avgL:gLetter(avg(a.g)),lastG:a.gl[a.gl.length-1]||'',firstG:a.gl[0]||'',trend:a.g.length>1?a.g[a.g.length-1]-a.g[0]:null,n:a.pr.size})).sort((a,b)=>b.reps-a.reps);const all=R.map(r=>GR[r.grade]).filter(Boolean);
  return {reps:R.reduce((a,r)=>a+r.reps,0),grade:gLetter(avg(all)),plays};}
function openPlayerDetail(id){const {cur}=windows();const b=playerPlaybook(cur,id);const ps=playerStats(cur).find(x=>x.id===id);const name=playerName(id);
  const ov=document.createElement('div');ov.className='dlg-ov';
  ov.innerHTML=`<div class="dlg" style="max-width:560px"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><div class="rt-name">${headshotHtml(id)}<span class="dlg-t" style="margin:0">${esc(name)}</span></div><button class="btn btn-ghost btn-sm" data-r="0">Close</button></div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"><div class="kpi"><div class="k">Playbook</div><div class="v">${b.grade?`<span class="gb g${b.grade}" style="font-size:16px;width:28px;height:26px">${b.grade}</span>`:'–'}</div><div class="s">${b.reps} reps in ${b.plays.length} play${b.plays.length===1?'':'s'}</div></div><div class="kpi"><div class="k">Overall rating</div><div class="v">${ps?ps.overallPct+'%':'–'}</div><div class="s">${ps?ps.n+' practice'+(ps.n===1?'':'s')+' rated':'not rated'}</div></div><div class="kpi"><div class="k">Weakest</div><div class="v" style="font-size:1.1rem">${ps&&ps.weakest?esc(ps.weakest.l):'–'}</div><div class="s">${ps&&ps.weakest?Math.round(ps.weakest.v*10)+'%':''}</div></div></div>
    <div class="card" style="margin-bottom:8px"><div class="ct">Plays run with ${esc(name.split(' ')[0])}'s group</div>${b.plays.length?`<div class="tw"><table><thead><tr><th>Play</th><th class="n">Practices</th><th class="n">Reps</th><th class="n">Avg</th><th class="n">Trend</th></tr></thead><tbody>${b.plays.map(p=>`<tr><td>${esc(p.name)}<span class="sub">${esc(p.section)}</span></td><td class="n">${p.n}</td><td class="n">${p.reps}</td><td class="n">${gb(p.avgL)}</td><td class="n" title="${p.trend===null?'Graded once':esc(p.firstG)+' to '+esc(p.lastG)}">${p.trend===null?'<span class="dl flat">—</span>':p.trend>0?`<span class="dl up">▲ ${esc(p.firstG)}→${esc(p.lastG)}</span>`:p.trend<0?`<span class="dl down">▼ ${esc(p.firstG)}→${esc(p.lastG)}</span>`:'<span class="dl flat">— held '+esc(p.lastG)+'</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="hint">No plays tallied for a group that includes this player in this window.</div>'}</div>
    ${ps?`<div class="card" style="margin-bottom:0"><div class="ct">Ratings · staff average</div><div class="tw"><table><thead><tr><th>Criterion</th><th class="n">Avg</th><th class="n">Band</th></tr></thead><tbody>${ps.crit.map(c=>`<tr><td>${c.l}</td><td class="n">${Math.round(c.v*10)}%</td><td class="n"><span class="band">${BANDS[Math.min(4,Math.max(0,Math.ceil(c.v/2)-1))]}</span></td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
  ov.addEventListener('click',e=>{if(e.target.closest('[data-r="0"]')||e.target===ov)ov.remove();});document.body.appendChild(ov);}
function staffCard(cur){const R=ratingRowsFor(cur),C=callRowsFor(cur);const ids=[...new Set([...R.map(r=>r.coach),...C.map(r=>r.coach)])];if(!ids.length)return '';
  const rows=ids.map(cid=>{const sr=R.filter(r=>r.coach===cid&&r.sid==='session');const pr=R.filter(r=>r.coach===cid&&r.sid!=='session');const cr=C.filter(r=>r.coach===cid);const grades=cr.map(r=>GR[r.grade]).filter(Boolean);
    return {cid,name:coachName(cid),practices:new Set([...sr,...pr,...cr].map(r=>r.pid)).size,reps:cr.reduce((a,r)=>a+r.reps,0),grade:gLetter(avg(grades)),session:sr.length?Math.round(avg(sr.map(r=>r.score))*10):null,players:new Set(pr.map(r=>r.sid)).size,prating:pr.length?Math.round(avg(pr.map(r=>r.score))*10):null};}).sort((a,b)=>(coach(a.cid)&&coach(a.cid).role==='head'?-1:0)-(coach(b.cid)&&coach(b.cid).role==='head'?-1:0));
  return `<div class="card"><div class="ct">Staff · head coach only<span class="ct-r">${ids.length} coaches</span></div><div class="tw"><table><thead><tr><th>Coach</th><th class="n">Practices</th><th class="n">Reps logged</th><th class="n">Avg grade given</th><th class="n">Session rating</th><th class="n">Players rated</th><th class="n">Avg player rating</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}${coach(r.cid)&&coach(r.cid).role==='head'?'<span class="sub">Head coach</span>':''}</td><td class="n">${r.practices}</td><td class="n">${r.reps}</td><td class="n">${gb(r.grade)}</td><td class="n">${r.session!==null?r.session+'%':''}</td><td class="n">${r.players}</td><td class="n">${r.prating!==null?r.prating+'%':''}</td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:8px">Grades and ratings are averaged across staff everywhere else. This table shows each coach's own tendencies.</div></div>`;}

function trackNext(cur,prev,all){const last=all.slice().reverse().find(p=>buckets(p).some(([,b])=>b.reflect&&(b.reflect.carry||b.reflect.saw||b.reflect.notes)))||all[all.length-1];const notes=buckets(last).filter(([,b])=>(b.reflect&&(b.reflect.carry||b.reflect.saw||b.reflect.notes))||Object.keys(b.drillNotes||{}).length).map(([cid,b])=>{const dn=drillNoteLines(last,b);return {cid,notes:[(b.reflect||{}).notes||'',...dn.map(n=>`${n.label}: ${n.text}`)].filter(Boolean).join('\n'),carry:(b.reflect||{}).carry||'',saw:(b.reflect||{}).saw||''};});
  const subs=subStatus();const stale=subs.filter(s=>s.stale).sort((a,b)=>(b.last?b.last.ago:999)-(a.last?a.last.ago:999));
  const plays=playStats(cur);const clean=plays.filter(p=>p.avgN!==null&&p.avgN<2.5&&p.reps>=2).sort((a,b)=>a.avgN-b.avgN);const slipping=plays.filter(p=>p.prevG&&p.lastG&&GR[p.lastG]<GR[p.prevG]&&!clean.includes(p));
  const never=playsAll().filter(p=>menu().includes(p.id)&&!all.some(x=>aggCalls(x)[p.id]&&aggCalls(x)[p.id].reps));
  const SS=sessionStats(cur);const rated=SS.crit.filter(c=>c.avg!==null);const lowest=rated.slice().sort((a,b)=>a.avg-b.avg)[0];const declining=rated.filter(c=>c.trend!==null&&c.trend<=-1&&c!==lowest);
  const players=playerStats(cur);const byWeak={};players.forEach(p=>{if(p.weakest&&(p.weakest.v<=6||(p.trend!==null&&p.trend<=-1))){(byWeak[p.weakest.l]||(byWeak[p.weakest.l]=[])).push(p);}});const rising=players.filter(p=>p.trend!==null&&p.trend>=1);
  const C=catMix(cur),P=catMix(prev);const drift=prev.length?Object.keys({...C.share,...P.share}).map(k=>({k,d:(C.share[k]||0)-(P.share[k]||0)})).filter(x=>Math.abs(x.d)>=10):[];
  const card=(title,items,empty,more)=>`<div class="rec"><div class="rc-h">${title}<span class="ct-r">${items.length}</span></div>${items.length?`<ul>${items.slice(0,more||6).map(i=>`<li><span class="rc-t">${i[0]}</span><span class="rc-w">${i[1]}</span></li>`).join('')}</ul>${items.length>(more||6)?`<div class="hint" style="margin-top:6px">+${items.length-(more||6)} more in Time and Results</div>`:''}`:`<div class="hint">${empty}</div>`}</div>`;
  const fields=[['notes','Notes'],['saw','What we saw'],['carry','Carry over']];const has=k=>notes.some(n=>n[k]);if(!notes.some(n=>n[RN]))RN=(fields.find(([k])=>has(k))||['carry'])[0];
  const fromLast=`<div class="card last"><div class="ct">From ${esc(label(last))}${last.meta.date?` · ${esc(last.meta.date)}`:''}<span class="ct-r"></span></div>
    <div class="pillrow">${fields.map(([k,l])=>`<button class="pillbtn ${RN===k?'on':''}" onclick="RN='${k}';renderTracker()">${l}${has(k)?`<i>${notes.filter(n=>n[k]).length}</i>`:''}</button>`).join('')}</div>
    ${notes.length?(notes.filter(n=>n[RN]).map(n=>`<div class="q"><div class="ql">${esc(coachName(n.cid))}${coach(n.cid)&&coach(n.cid).role==='head'?' · head coach':''}</div><div class="qt">${esc(n[RN])}</div></div>`).join('')||'<div class="hint">Nobody wrote this one for the last practice.</div>'):'<div class="hint">No reflection written for the last practice. Add one in Results and it will lead this page.</div>'}</div>`;
  return fromLast+`<div class="recs">
    ${card('Return to',stale.map(s=>[`${esc(s.sub)}<span class="sub">${esc(s.focus)}</span>`,s.last?`${s.last.ago} practices since ${esc(label(s.last.p))}`:'never worked']),'Every drill in the library has had reps in the last '+STALE_N+' practices.',8)}
    ${card('Clean up',clean.map(p=>[`${esc(p.name)}<span class="sub">${esc(p.section)}</span>`,`${p.reps} reps over ${p.occ} practice${p.occ>1?'s':''} · avg ${p.avgL}, last ${p.lastG}`]).concat(slipping.map(p=>[`${esc(p.name)}<span class="sub">${esc(p.section)}</span>`,`slipped ${p.prevG} to ${p.lastG} last time out`])),'No play is grading out below B.')}
    ${card('Install',never.map(p=>[`${esc(p.name)}<span class="sub">${esc(p.section)}</span>`,'on the menu, never run']),'Everything on the menu has been run at least once.')}
    ${card('Team emphasis',(lowest?[[lowest.l,`lowest session criterion · avg ${Math.round(lowest.avg*10)}%, ${BANDS[Math.min(4,Math.max(0,Math.ceil(lowest.avg/2)-1))]}${lowest.trend!==null&&lowest.trend<0?', trending down':''}`]]:[]).concat(declining.map(c=>[c.l,`down ${Math.round(Math.abs(c.trend)*10)} pts since ${esc(label(cur[0]))}`])).concat(drift.map(x=>[`${esc(x.k)} time`,`${x.d>0?'up':'down'} ${Math.abs(x.d)} pts of practice share vs the previous ${prev.length}`])),'Rate a few sessions and the weakest criterion will show here.')}
    ${card('Work with',Object.entries(byWeak).map(([c,ps])=>[c,ps.map(p=>`${esc(p.name)} ${Math.round(p.weakest.v*10)}%${p.trend!==null&&p.trend<=-1?' ▼':''}`).join(' · ')]),players.length?'No player is below Proficient or trending down.':'Rate players in Results to see who needs what.')}
    ${rising.length?card('Trending up',rising.map(p=>[esc(p.name),`${delta(Math.round(p.trend*10),' pts')} overall · now ${p.overallPct}%`]),''):''}
  </div>
  <details class="how"><summary>How these are chosen</summary><ul><li>Return to: drills with no reps in the last ${STALE_N} practices, or ever.</li><li>Clean up: plays with 2+ reps averaging C or worse, plus any play whose last grade dropped.</li><li>Install: plays on the current menu with zero reps in any practice.</li><li>Team emphasis: the lowest-averaging session criterion, criteria down a point or more across the window, and any category whose share of practice time moved 10+ points.</li><li>Work with: players whose weakest criterion averages 6 or below, or who dropped a point or more, grouped by that criterion.</li></ul></details>`;}

const PAL=['#E85D2C','#5E9EFF','#34C56F','#A78BFA','#E8B14A','#F04444','#9BA0A8','#2DD4BF'];
function chart(ps,R,cols){if(ps.length<2)return '';
  const cs=[...new Set(R.map(r=>r.cat))];const col=cols||Object.fromEntries(cs.map((c,i)=>[c,PAL[i%PAL.length]]));
  const W=Math.max(480,ps.length*48+60),H=170,L=36,B=26,top=10;const per=ps.map(p=>{const m={};R.filter(r=>r.pid===p.id).forEach(r=>m[r.cat]=(m[r.cat]||0)+r.minutes);return m;});
  const max=Math.max(1,...per.map(m=>Object.values(m).reduce((a,b)=>a+b,0)));const slot=(W-L-10)/ps.length;const bw=Math.min(34,slot-8);
  let g='';ps.forEach((p,i)=>{let y=H-B;const x=L+10+i*slot+(slot-bw)/2;cs.forEach(c=>{const v=per[i][c]||0;if(!v)return;const h=(H-B-top)*v/max;y-=h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${col[c]}"><title>${esc(titleOf(p))} · ${esc(c)} · ${v} min</title></rect>`;});
    if(!Object.keys(per[i]).length)g+=`<rect x="${x}" y="${H-B-2}" width="${bw}" height="2" fill="#353A42"><title>${esc(titleOf(p))} · no blocks</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="9" fill="#9BA0A8" font-family="JetBrains Mono,monospace">#${esc(p.meta.number)}</text>`;});
  const ticks=[0,.5,1].map(f=>`<line x1="${L}" x2="${W}" y1="${H-B-(H-B-top)*f}" y2="${H-B-(H-B-top)*f}" stroke="#272C33"/><text x="${L-4}" y="${H-B-(H-B-top)*f+3}" text-anchor="end" font-size="9" fill="#5A5F66" font-family="JetBrains Mono,monospace">${Math.round(max*f)}</text>`).join('');
  return `<div class="card chart"><div class="ct">Minutes per practice</div><svg viewBox="0 0 ${W} ${H}">${ticks}${g}</svg></div>`;}

function tableRows(){const R=rows();return [['Date','Practice','Category','Focus','Sub-focus','Block','Line','Minutes','Occurrence','Level'],...R.map(r=>[r.date,r.practice,r.cat,r.focus,r.sub,r.block,r.line,r.minutes,r.occ,r.level])];}
function ratingTableRows(){return [['Date','Practice','Coach','Subject','Criterion','Score','Band'],...ratingRows().map(r=>[r.date,r.practice,coachName(r.coach),r.subject,r.critLabel,r.score,BANDS[Math.ceil(r.score/2)-1]])];}
function callTableRows(){return [['Date','Practice','Coach','Group','Section','Play','Reps','Grade'],...callRows().map(r=>[r.date,r.practice,coachName(r.coach),r.group||'team',r.section,r.call,r.reps,r.grade])];}
const toCsv=d=>d.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
async function exportTable(kind){const name=`practice-tracker-${today()}`;
  if(kind==='csv')return deliver(name+'.csv',toCsv(tableRows()),'text/csv');
  if(kind==='calls')return deliver(name+'-plays.csv',toCsv(callTableRows()),'text/csv');
  if(kind==='ratings')return deliver(name+'-ratings.csv',toCsv(ratingTableRows()),'text/csv');
  if(!window.XLSX){toast('XLSX library still loading. Try a CSV.');return;}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tableRows()),'Time');
  const sum=[['Category','Focus','Sub-focus','Minutes','Occurrences']];const agg={};rows().forEach(r=>{const k=[r.cat,r.focus,r.level==='line'?r.sub:''].join('|');const a=agg[k]||(agg[k]={m:0,o:0});a.m+=r.minutes;a.o+=r.occ;});
  Object.entries(agg).sort().forEach(([k,a])=>{const [c,f,s]=k.split('|');sum.push([c,f,s,+a.m.toFixed(1),a.o]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'Summary');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(callTableRows()),'Plays');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ratingTableRows()),'Ratings');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});await deliver(name+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));}

const BK={dirtySince:null,lastBackup:null,dir:null,perm:'none',timer:null};
const DKEY='luceo.backup.meta';
function bkLoadMeta(){try{const m=JSON.parse(localStorage.getItem(DKEY)||'{}');BK.dirtySince=m.dirtySince||null;BK.lastBackup=m.lastBackup||null;BK.lastSync=m.lastSync||null;BK.applied=m.applied||{};}catch(e){}}
function bkSaveMeta(){try{localStorage.setItem(DKEY,JSON.stringify({dirtySince:BK.dirtySince,lastBackup:BK.lastBackup,lastSync:BK.lastSync||null,applied:BK.applied||{}}));}catch(e){}}
function bkTouch(){if(!BK.dirtySince){BK.dirtySince=new Date().toISOString();bkSaveMeta();}bkRenderStatus();bkScheduleAuto();}
const bkStamp=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});};

function starterTemplates(){const curated=STARTERS_CURATED.map(t=>({id:t.id,name:t.name,builtin:true,focus:t.focus,keyFocus:{text:t.keyFocus.text,bullets:t.keyFocus.bullets.slice(),clips:[]},blocks:stripBlocks(t.blocks,false)}));
  const sample=demoPractices().map(p=>({id:'starter-'+p.meta.number,name:p.meta.title,builtin:true,focus:p.meta.focus,keyFocus:{text:p.keyFocus.text||'',bullets:(p.keyFocus.bullets||[]).slice(),clips:[]},blocks:stripBlocks(p.blocks,false)}));return curated.concat(sample);}
function templateById(id){return starterTemplates().find(t=>t.id===id)||templates().find(t=>t.id===id)||null;}
function templateSummary(t){const mins=t.blocks.reduce((a,b)=>a+num(b.min),0);const n=t.blocks.reduce((a,b)=>a+(b.lines||[]).length,0);const cats={};t.blocks.forEach(b=>{if(b.cat)cats[b.cat]=(cats[b.cat]||0)+num(b.min);});const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c])=>c).join(', ');return `${t.blocks.length} blocks · ${mins} min · ${n} drills${top?' · '+top:''}`;}

async function applyTemplate(id){if(!seasonEditable()){toast('This season is archived.');return;}const t=templateById(id);if(!t||!S)return;
  if(S.blocks.length&&!await ask(`Replace this practice's ${S.blocks.length} block${S.blocks.length===1?'':'s'}, key focus and theme with "${t.name}"? Results are not affected.`,'Use template'))return;
  if(Array.isArray(t.menu))S.menu=t.menu.filter(id=>playsAll().some(p=>p.id===id));S.blocks=stripBlocks(t.blocks,true);S.keyFocus={text:t.keyFocus.text||'',bullets:(t.keyFocus.bullets||[]).slice(),clips:[]};if(!S.meta.focus&&t.focus)S.meta.focus=t.focus;if(!S.meta.title&&t.name)S.meta.title=t.name;
  S.blocks.forEach((b,i)=>{taxEnsure(b.cat,b.focus);b.lines.forEach((l,j)=>{if(b.cat&&b.focus&&l.sub)taxEnsure(b.cat,b.focus,l.sub);drillCommit(i,j);});});syncTags(S);
  persist('settings');up('practice',true);renderLib();toast(`Plan built from "${t.name}". Edit anything.`);}
async function saveTemplate(){if(!S||!S.blocks.length){toast('Add blocks first.');return;}const name=await askText('Save this practice as a template',{value:S.meta.title||'',placeholder:'Tryouts, Game day minus one, Shootaround',okLabel:'Save template',hint:'Blocks, drills, key focus, theme and the play rail are kept. Results, clock and diagrams are not.'});if(name===null||!name)return;

function importLibrary(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{try{await confirmImport(JSON.parse(e.target.result),f.name);}catch(err){toast('That is not a library backup file.');}};r.readAsText(f);inp.value='';}

/* Chrome / Edge folder sync via File System Access */
const FSA_OK=typeof window.showDirectoryPicker==='function';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('luceo-backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function bkInitFolder(){if(!FSA_OK)return;const h=await idbGet('dir');if(!h)return;BK.dir=h;try{BK.perm=await h.queryPermission({mode:'readwrite'});}catch(e){BK.perm='prompt';}bkRenderStatus();if(BK.perm==='granted'){await bkSync();if(BK.dirtySince)bkScheduleAuto();}}
async function bkReconnect(){if(!BK.dir)return;try{BK.perm=await BK.dir.requestPermission({mode:'readwrite'});}catch(e){BK.perm='denied';}bkRenderStatus();if(BK.perm==='granted'){toast('Folder reconnected');await bkSync();if(BK.dirtySince)bkWrite();}}
async function bkChooseFolder(){if(!FSA_OK){toast('Folder backup needs Chrome or Edge.');return;}
  try{const h=await window.showDirectoryPicker({mode:'readwrite',id:'luceo-backup'});BK.dir=h;BK.perm='granted';await idbSet('dir',h);bkRenderStatus();document.querySelector('.dlg-ov')?.remove();await bkWrite();toast('Backup folder set: '+h.name);}
  catch(e){if(e&&e.name==='AbortError')return;toast('Could not open that folder: '+(e.message||e.name||'error'));}}
async function bkWrite(){if(!BK.dir||BK.perm!=='granted')return false;try{const fh=await BK.dir.getFileHandle(bkFilename(false),{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(backupPayload(),null,2));await w.close();bkMarkSaved();return true;}catch(e){toast('Backup write failed: '+(e.message||'error'));return false;}}
function bkScheduleAuto(){if(!BK.dir||BK.perm!=='granted')return;clearTimeout(BK.timer);BK.timer=setTimeout(bkWrite,15000);}
async function bkSync(quiet){if(!BK.dir||BK.perm!=='granted')return null;const files=[];try{for await(const [name,h] of BK.dir.entries()){const m=/^luceo-(library|results)-.*\.json$/i.exec(name);if(h.kind==='file'&&m){const f=await h.getFile();files.push({name,kind:m[1],h,mod:f.lastModified});}}}catch(e){return null;}
  files.sort((a,b)=>b.mod-a.mod);const newest={};for(const f of files){try{const j=JSON.parse(await (await f.h.getFile()).text());const key=f.kind+':'+(j.coachId||f.name);if(!newest[key])newest[key]={f,j};}catch(e){}}
  const me=coachId();const report=[];BK.applied=BK.applied||{};
  for(const [key,{f,j}] of Object.entries(newest)){if(j.coachId===me)continue;if(BK.applied[key]&&f.mod<=BK.applied[key])continue;
    if(j.kind==='luceo-library'){if(isHead())continue;const h=(j.settings&&j.settings.coaches||[]).find(c=>c.id===j.coachId);if(!(h&&h.role==='head'))continue;await applyLibrary(j);report.push(`Plan and library from ${j.coachName||'head coach'}`);}

const TUT=[
 {t:'How the builder works',k:'Overview',b:`<p>The builder does three jobs, and the header switches between them.</p>
  <ul><li><b>Build</b> is where the head coach writes the practice plan.</li><li><b>Manage</b> is the plan on a tablet during practice: a clock, check-offs, and tallies.</li><li><b>Track</b> turns everything recorded into a report: where the time went, what it produced, what to do next.</li></ul>
  <p>Everything hangs off one idea: the plan is written once by one person, and the results are recorded by whoever ran each part of practice.</p>`},
 {t:'Roles',k:'Head coach and assistants',b:`<p>Each coach picks themselves from the coach button in the header. That name is attached to everything they record on that device.</p>
  <ul><li><b>Head coach</b> builds the plan, manages the library, runs the clock, sets actual block times, and sees the staff comparison. There is only one, and the head coach hands the role to someone else in Library › Coaches.</li>
  <li><b>Assistants</b> read the plan, check off the drills they ran, tally and grade plays for their player group, rate the session and their players, and write their own notes.</li></ul>
  <p>No two coaches can overwrite each other. Each coach's results sit in their own bucket on the practice and the reports combine them.</p>`},
 {t:'Team',k:'Start here',b:`<p>The Team tab in Build is where every session starts: pick your team, then pick yourself.</p>
  <ul><li><b>Team brand</b>: the team selector sits at the top. One device can hold several teams; each has its own brand, staff, roster, drills, plays, templates, seasons and practices. Switch teams here, or create a new one.</li><li><b>Coaches</b>: add the staff, then press <b>This is me</b> on your name. Everything you record (drill checks, reps, grades, ratings, reflection) is filed under it on this device. The head coach writes the plan and owns the team setup; assistants record from their stations.</li><li><b>Roster</b>: players with headshots, used for player groups and ratings.</li><li><b>Season</b>: start a new season to archive the current one; archived seasons stay readable.</li><li><b>Team file</b>: one small file with all of the above plus your drills and plays. Save it once the team is set up; load it on a new device and you are back in one step.</li></ul>
  <p>Drills and plays are not set up here. They build themselves as you write plans. To fix a typo or merge duplicates later, open the menu (⋯) › <b>Manage drills &amp; plays</b>.</p>`},
 {t:'Build',k:'Writing the plan',b:`<p>The Plan tab is the practice itself. The sheet on the right updates as you type. The <b>Practice</b> container at the top picks which practice you are writing, with New, Duplicate and Delete.</p>
  <ul><li><b>Session</b>: number, date, and the banner line (theme, question, quote, pillars).</li><li><b>Key focus</b>: the one thing the practice is about, with points and video clips.</li>
  <li><b>Blocks</b>: timed sections, each tagged with a Category and Focus. Each block holds drills; a drill gets a Sub-focus, an objective, and a player group picked from the roster.</li><li><b>Play menu</b>: which plays appear on the rail for this practice.</li></ul>
  <p>Running totals, the planned time, and the rail are all generated. New asks for a title, then starts an empty plan with the next number and today's date. Duplicate copies the selected practice (blocks, drills, groups, key focus, play menu) under a new title; results, clock and diagrams start empty. Titles show in the practice list, on the sheet and in Track, so you can pick what to duplicate without opening each plan.</p><p><b>Templates.</b> Session › Templates lists Luceo starter plans and your own saved ones. Use one and its blocks, drills, key focus and theme are copied into today's practice; results stay empty. Save any practice as a template once it is a shape you will reuse (tryouts, game day minus one, shootaround).</p><p><b>Drills and plays build themselves.</b> In a block, type a category or focus: matches appear as you type and anything new is created on the spot. Under Drills, search your library to add one, or press New drill to create one in the drill editor (name, diagram or video, category › focus › sub-focus); it is saved for every plan after this one. Each drill row shows its objective and player group; click the name to open the drill. The Play menu is this practice's rail and starts empty. Under each section, add the calls you will run today one row at a time: pick from your playbook, or press New play to open the play editor (name, section, a diagram or video, a description). Click any play on the rail to open it. New sections are added at the bottom (Jungle, Turbo, SOB, BOB, ATO). Sub-focus on drills is optional.</p>`},
 {t:'Manage',k:'On the floor',b:`<p>Manage shows the sheet full width for a tablet, with a live bar above it.</p>
  <ul><li>The head coach starts the clock. The current block counts down; amber at two minutes, red and a tone when it runs over. Tapping a block checks it off and starts the next.</li>
  <li>Every coach checks the drills they ran, picks their player group, and taps plays on the rail to add reps. The icon beside each rail heading opens reps and grades for that section.</li>
  <li><b>Court</b> opens a whiteboard: draw, place roster pucks and move them, open a linked play or drill diagram. Diagrams save with the practice.</li></ul>`},
 {t:'Results',k:'After practice',b:`<p>The Results tab is each coach's own record of the session.</p>
  <ul><li><b>Play execution</b>: reps and A to D grades, by player group.</li><li><b>Ratings</b>: the session on five criteria, and optionally each player. Staff scores are averaged in the reports.</li><li><b>Court diagrams</b>: review what was drawn.</li><li><b>Reflection</b>: notes, what we saw, carry into next practice. Other coaches' notes show beneath yours.</li></ul>`},
 {t:'Track',k:'Reading the season',b:`<p>Track has three views and a range control (last 5, last 10, all, custom).</p>
  <ul><li><b>Next up</b> opens first: the staff's carry-over notes, then suggestions with their reasons. Return to, Clean up, Install, Team emphasis, Work with.</li><li><b>Time</b>: minutes by category and focus, the shift from the previous window, and drills the plan has skipped.</li><li><b>Results</b>: session rating trend, plays sorted into cleanup and executing well, players with group reps, a playbook grade, and their weakest criterion. Tap a grade for the player's detail.</li></ul>
  <p>Every container has a one-line note on how to read it. Save report PDF prints all three views.</p>`},
 {t:'Backups and sharing',k:'How the history is kept',b:`<p>Each coach's device writes its own file. The head coach's file is the plan and library; an assistant's file is their results only. Nothing anyone writes can overwrite another coach's work.</p>
  <ul><li>With the shared Google Drive folder connected (Chrome or Edge), the builder pulls the head coach's latest plan and every assistant's latest results on open, when it returns to the foreground, and before each backup. Then it writes its own daily file.</li>
  <li>Without the folder, Back up now downloads the file and Restore reads one. Same merge rules.</li><li>Any day's files can be restored on their own, so the folder is the history.</li></ul>
  <p>Set up shared folder in the Backup menu walks through the Drive setup.</p>`},
 {t:'Seasons',k:'Archiving and starting over',b:`<p>Every practice belongs to a season. The season chip beside the practice list shows which one you're in.</p>
  <ul><li><b>Start a new season</b> (head coach) archives the current one and begins at Practice #1. Coaches, drills and plays carry forward; the roster can carry or start empty.</li><li><b>Archived seasons</b> stay readable: open any practice, read every coach's results, run Track on it. Nothing can be added or changed.</li><li><b>Export a season</b> to its own file for cold storage or to hand off. A season file can be added back later as an archive.</li></ul>
  <p>Backups always include every season, so archiving changes what you see, not what is kept.</p><p><strong>Starting out.</strong> The builder opens empty: it asks for the head coach's name, then you set the team brand, add staff and roster, build the drill taxonomy and playbook in Library, and write your first plan. Want a plan without starting from scratch? Open Plan › Session › <em>Templates</em>: five Luceo starter plans, plus any practice you save as a template. To see Track and Results filled in, the menu (⋯) has <em>Load sample season</em>, a sample team with five practices and results; <em>Clear sample season</em> removes only what the sample brought (its practices, staff, players, and any sample drills and plays nothing of yours uses) and keeps your brand, staff and practices. To wipe a team completely, delete it from Team › Team brand or start a new one from the header dropdown.</p>`}];
let TUTi=0;
function openTutorial(page){TUTi=Number.isInteger(page)?Math.max(0,Math.min(TUT.length-1,page)):0;const ov=document.createElement('div');ov.className='dlg-ov tut';

    <div class="dlg-b"><button class="btn btn-ghost btn-sm" data-r="close">Close</button><span style="flex:1"></span><button class="btn btn-secondary btn-sm" data-r="prev" ${TUTi===0?'disabled':''}>Back</button><button class="btn btn-primary btn-sm" data-r="next">${TUTi===TUT.length-1?'Done':'Next'}</button></div></div>`;};
  ov.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d){TUTi=+d.dataset.i;render();return;}const r=e.target.closest('[data-r]');if(r){if(r.dataset.r==='next'){if(TUTi<TUT.length-1){TUTi++;render();}else ov.remove();}else if(r.dataset.r==='prev'){TUTi--;render();}else ov.remove();return;}if(e.target===ov)ov.remove();});
  document.addEventListener('keydown',function k(e){if(!document.body.contains(ov)){document.removeEventListener('keydown',k);return;}if(e.key==='ArrowRight'&&TUTi<TUT.length-1){TUTi++;render();}if(e.key==='ArrowLeft'&&TUTi>0){TUTi--;render();}if(e.key==='Escape')ov.remove();});
  render();document.body.appendChild(ov);}

function woodSvg(full){const W=500,H=full?940:470;let seed=full?11:5;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const tones=['#F1E3C9','#EEDFC3','#F3E6CE','#EBDBBD','#F0E1C6','#EDDEC1','#F4E8D1','#E9D9BA'];
  const pw=10;let planks='',seams='',grain='';
  // wide maple boards, long grain running baseline to baseline, staggered seams
  for(let x=0;x<W;x+=pw){let y=-rnd()*120;while(y<H){const len=70+rnd()*110;const t=tones[Math.floor(rnd()*tones.length)];
      planks+=`<rect x="${x}" y="${y.toFixed(1)}" width="${pw}" height="${len.toFixed(1)}" fill="${t}"/>`;
      seams+=`<line x1="${x+.3}" y1="${(y+len).toFixed(1)}" x2="${x+pw-.3}" y2="${(y+len).toFixed(1)}"/>`;
      // a few soft grain streaks per board
      const n=1+Math.floor(rnd()*3);for(let k=0;k<n;k++){const gx=x+1.5+rnd()*(pw-3);const gy=y+rnd()*len*.6;const gl=len*(.25+rnd()*.5);const op=(.05+rnd()*.12).toFixed(2);
        grain+=`<path d="M${gx.toFixed(1)} ${gy.toFixed(1)} q${(rnd()*1.2-.6).toFixed(2)} ${(gl/2).toFixed(1)} 0 ${gl.toFixed(1)}" stroke="#B48A55" stroke-opacity="${op}" stroke-width="${(.4+rnd()*.5).toFixed(2)}" fill="none"/>`;}
      y+=len;}}
  // faint wide tonal bands across the floor, like the reference
  let bands='';for(let y=0;y<H;y+=46+Math.floor(rnd()*30)){bands+=`<rect x="0" y="${y}" width="${W}" height="${30+rnd()*40}" fill="#000" opacity="${(rnd()*.02).toFixed(3)}"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spot" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".05"/></radialGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="#EFE0C5"/>
  <g>${planks}</g>
  <g>${grain}</g>
  <g>${bands}</g>
  <g stroke="#B99A6E" stroke-opacity=".35" stroke-width=".45">${Array.from({length:Math.ceil(W/pw)+1},(_,i)=>`<line x1="${i*pw}" y1="0" x2="${i*pw}" y2="${H}"/>`).join('')}</g>
  <g stroke="#A68658" stroke-opacity=".45" stroke-width=".6">${seams}</g>
  <rect width="${W}" height="${H}" fill="url(#spot)"/>
  </svg>`;}

function fitSheet(){const st=document.querySelector('.stage');const sh=document.getElementById('sheet');if(!st||!sh)return;
  const manage=document.getElementById('app').dataset.mode==='manage';sh.style.removeProperty('--scale');sh.style.zoom='';

async function printSheet(kind){if(PDF_BUSY)return;const app=document.getElementById('app');const mode=kind==='report'?'track':kind==='plan'?'build':app.dataset.mode;
  if(!window.html2canvas||!window.jspdf){toast('PDF engine still loading. Try again in a moment.');return;}
  PDF_BUSY=true;toast('Building PDF…');
  try{await (document.fonts?document.fonts.ready:Promise.resolve());
    const stage=document.createElement('div');stage.className='pdfstage';document.body.appendChild(stage);
    let parts=[],filename;
    if(mode==='track'){const {cur,prev,all}=windows();if(!cur.length){toast('Nothing to report yet');return;}
      const t=ST.team;const initial=(t.name||'L').trim().charAt(0).toUpperCase();
      const head=`<div class="rp-head"><div class="sh-logo">${t.logo?`<img src="${t.logo}" alt="">`:`<div class="mono-mark">${esc(initial)}</div>`}</div><div><div class="sh-team">${esc(t.name)}</div><div class="sh-title">Practice <span class="num">Report</span></div></div><div class="sh-date"><div class="d">${cur.length} practice${cur.length>1?'s':''}</div><div class="t">${esc(cur[0].meta.date||'')}${cur.length>1?' to '+esc(cur[cur.length-1].meta.date||''):''}</div></div></div>`;
      const secs=[['Next up',trackNext(cur,prev,all)],['Time',trackTime(cur,prev)],['Results',trackResults(cur,prev)]];
      secs.forEach(([title,html],k)=>{const d=document.createElement('div');d.className='tracker rp';d.style.display='block';d.innerHTML=(k===0?head:'')+`<section class="rp-sec"><div class="rp-title">${title}</div>${html}</section>`;stage.appendChild(d);parts.push(d);});
      filename=`practice-report-${cur[0].meta.date||''}-to-${cur[cur.length-1].meta.date||''}.pdf`;}
    else{const clone=document.getElementById('sheet').cloneNode(true);clone.id='';clone.style.removeProperty('--scale');stage.appendChild(clone);parts.push(clone);
      clone.querySelectorAll('.rail .rc').forEach(rc=>{const kids=[...rc.children];const half=Math.ceil(kids.length/2);const a=document.createElement('div'),b=document.createElement('div');kids.forEach((k,i)=>(i<half?a:b).appendChild(k));rc.append(a,b);});
      filename=`${(S.meta.label||'practice').toLowerCase().replace(/\s+/g,'-')}-${S.meta.number||''}-${S.meta.date||''}.pdf`;}
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'letter',orientation:'portrait'});const PW=612,PH=792;let first=true;
    for(const el of parts){const canvas=await html2canvas(el,{scale:2,backgroundColor:'#0B0D10',useCORS:true,logging:false});
      const ratio=PW/canvas.width;const pageH=Math.floor(PH/ratio);let y=0;
      while(y<canvas.height){if(!first)pdf.addPage();first=false;const h=Math.min(pageH,canvas.height-y);const c=document.createElement('canvas');c.width=canvas.width;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#0B0D10';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
        pdf.setFillColor(11,13,16);pdf.rect(0,0,PW,PH,'F');pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,PW,h*ratio);y+=h;}}
    stage.remove();const blob=pdf.output('blob');await deliver(filename,blob,'application/pdf');}
  catch(e){toast('PDF failed: '+(e&&e.message?e.message:'error'));}
  finally{PDF_BUSY=false;document.querySelectorAll('.pdfstage').forEach(x=>x.remove());}}
